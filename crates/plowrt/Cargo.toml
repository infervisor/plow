[package]
name = "plowrt"
version.workspace = true
edition.workspace = true
license.workspace = true

# The plow host runtime: loads compiled assets, coordinates the persistent-kernel
# executors through counter pools / packet queues / an OOB channel, and fronts it
# all with an OpenAI-compatible API. See `docs/runtime/` and
# the design notes.

[[bin]]
name = "plowrt"
path = "src/main.rs"

[lib]
name = "plowrt"
path = "src/lib.rs"

[dependencies]
# Renders the CHECKPOINT'S OWN `chat_template.jinja`. Without it every model
# family needs a hand-written Rust prompt builder, and a family that matches no
# builder is served another model's markers as literal text. `loop_controls` is
# required, not optional: GLM's template uses `{% break %}`.
minijinja = { version = "2", default-features = false, features = ["builtins", "loop_controls", "macros", "multi_template"] }
# `strftime_now`, which HF chat templates call to stamp the current date into
# the system prompt. gpt-oss calls it unguarded (its render fails without it),
# and Llama-3.2 and Muse-Glimmer degrade to a stale or missing date. Already in
# the workspace lock via egglog with the same features, so it adds no build.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
plow-asset = { workspace = true }
packet = { workspace = true }
hwspec = { workspace = true }
costmodel = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
# Performance-first: lock-free structures + fast maps/vecs for hot paths, and a
# fast mutex for cold paths only. The per-token / per-packet path allocates and
# locks nothing — see `docs/runtime/00-overview.md` (performance model).
crossbeam-utils = "0.8"
parking_lot = "0.12"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = "0.7"
# Direct hyper access is used to serve the same axum router over a Unix domain
# socket alongside the TCP listener (axum 0.7's `serve` only takes TcpListener).
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"

# Optional: real tokenizer + checkpoint reader. Off by default so the skeleton
# builds fast and offline; a byte-fallback tokenizer stands in when absent.
tokenizers = { version = "0.20", optional = true }
safetensors = { version = "0.4", optional = true }
hf-hub = { workspace = true, optional = true }
# Asset distribution (`dist` feature): an HTTP client for the registry and zstd
# for the transport codec. Deliberately optional — `serve` performs no network
# I/O, and CI asserts no HTTP/TLS crate is present in the serve-only feature set.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"], optional = true }
zstd = { version = "0.13", optional = true }
# Runtime `dlopen` of the driver libs (see `device::cuda`/`device::hsa`): the
# static binary carries no link-time GPU dependency, and NVIDIA + AMD libs can be
# loaded side-by-side in one process (distinct `cu*` / `hsa_*` symbol namespaces).
libloading = { version = "0.8", optional = true }
# CPU engine: thread affinity / mbind for the persistent worker pool
# (`exec::cpu`). Optional because only the `cpu` feature links the kernel lib.
libc = { version = "0.2", optional = true }

# Metal GPU backend (`exec::apple`): objc2 bindings to Metal/Foundation. Frameworks are part of
# the OS, so they are linked, not dlopen'd. macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-core-ml = { version = "0.3", optional = true }

[build-dependencies]
# Compiles the CPU kernel library `runtime/cpu/dev/` into the binary (see
# build.rs). The GPU backends dlopen their drivers instead, so this is the only
# link-time native code plowrt carries, and only under `cpu`.
cc = { version = "1", optional = true }

[features]
default = []
# CPU device-ISA engine: persistent pinned worker threads in Rust, kernels in C
# (`runtime/cpu/dev/`, golden / AVX-512 / AMX tiers) built by build.rs and
# reached through `exec::cpu::ffi`. Real-weight loading (safetensors, tokenizer)
# joins this feature in P2 — see `plans/cpu-backend.md`.
cpu = ["dep:cc", "dep:libc", "dep:safetensors", "hf-tokenizer"]
# Metal GPU engine for Apple Silicon (plans/apple-silicon-backend.md rung 2). Builds on the CPU
# engine's loader (unified memory: the host tensors ARE the device buffers), so it implies `cpu`.
metal = ["cpu", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
# Apple Neural Engine executor (rung 4): CoreML programs run at segment boundaries of the
# Metal engine's walk (Event mode). Implies `metal`.
ane = ["metal", "dep:objc2-core-ml"]
# Real Hugging Face tokenizer (loads a model's `tokenizer.json`). Enable this
# alone for tokenization without pulling the checkpoint/download deps.
hf-tokenizer = ["dep:tokenizers"]
# Real HF tokenizer + safetensors weight loading + hub downloads.
hub = ["hf-tokenizer", "dep:safetensors", "dep:hf-hub"]
# Fetch compiled assets from a registry: `pull`, `load`, `upgrade`, `search`.
# `hf-hub` joins it because `load` also resolves the checkpoint, which the
# distribution never carries — weights always come from HuggingFace or a local
# directory.
dist = ["dep:ureq", "dep:zstd", "dep:hf-hub", "hf-tokenizer"]
# CUDA driver-API backend. The driver lib is `dlopen`ed at runtime (no link-time
# `-lcuda`), so the binary stays static except for libcuda. Pulls safetensors:
# a GPU serve is meaningless without real checkpoint weights (`exec::gpu`) —
# and pulls hf-tokenizer for the same reason: a real model served through the
# byte-fallback tokenizer produces silent garbage (a `--features cuda`-only
# build did exactly that, 2026-07-19; see serve() 's byte-fallback refusal).
cuda = ["dep:libloading", "dep:safetensors", "hf-tokenizer"]
# HSA driver-API backend (dlopen of libhsa-runtime64 — direct ROCr, no HIP).
# Pulls the same two extras as `cuda`, for the same two reasons: the AMD engine
# (`exec::amd`) binds checkpoint weights by tensor name, which needs the
# safetensors reader; and a real model served through the byte-fallback
# tokenizer produces silent garbage rather than an error (measured on the CUDA
# side, 2026-07-19). The features stay symmetric so an AMD serve cannot inherit
# a failure mode the NVIDIA one was fixed for.
hsa = ["dep:libloading", "dep:libc", "dep:safetensors", "hf-tokenizer"]

[dev-dependencies]
plow-asset = { workspace = true, features = ["test-util"] }
# `tests/op_audit_families.rs` emits one miniature blob per model family and runs
# the operator audit over it. Emission is host-only (`arch: ""`, config.json with
# no weights), so this adds no build requirement, and the dependency is acyclic:
# `devgen` depends on packet/costmodel/kernelcaps/tunedb/hwspec/plow-asset, never
# on `plowrt`.
devgen = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The upload-path microbenchmarks are CUDA-only (`#![cfg(feature = "cuda")]`);
# without this gate a non-cuda `cargo test -p plowrt` fails on their empty
# (main-less) expansions.
[[example]]
name = "h2d_bench"
required-features = ["cuda"]

# Reads the cu -> L2-domain recovery and the placement decision out of
# `exec::cpu::engine` rather than copying them, so it needs that engine
# compiled. Undeclared, it broke `--features hsa` builds of the workspace.
[[example]]
name = "l2_probe"
required-features = ["cpu"]

[[example]]
name = "reload_bench"
required-features = ["cuda"]

[[example]]
name = "s1_switch_bench"
required-features = ["cuda"]
