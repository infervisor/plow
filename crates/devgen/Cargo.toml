[package]
name = "devgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PLOWDEV device-blob emitter: HuggingFace checkpoint → runnable GPU packet program"

[dependencies]
costmodel = { workspace = true }
packet = { workspace = true }
kernelcaps = { workspace = true }
# Qualified measurements for `pick_tile`. `tunedb` depends only on `kernelcaps`
# + `hwspec`, both already here, so this adds no cycle and no new tree.
tunedb = { workspace = true }
hwspec = { workspace = true }
plow-asset = { workspace = true }
# V4.1's config is parsed and validated ONCE, here -- `costmodel` above already pulls
# nn-graph in transitively, so this is a direct edge onto a crate already in the tree and
# not a new dependency. The alternative was a second V4.1 reader beside `cfg_glm`, which
# would drift on exactly the fields that are easy to misread (`compress_ratios` and
# `kv_source_layer_ids` disagree by construction).
nn-graph = { workspace = true }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"

[dev-dependencies]
plow-asset = { workspace = true, features = ["test-util"] }
rewrite = { workspace = true }
