[package]
name = "rewrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rewriting half of the Infervisor JIT: nn-graph -> egglog equality saturation -> fused operator graph"

[dependencies]
nn-graph = { workspace = true }
costmodel.workspace = true
packet.workspace = true
egglog.workspace = true
thiserror.workspace = true
# Arbitrary-precision extraction cost. egglog's tree-additive cost combines with
# `saturating_add`, which pins at `u64::MAX` past ~21 residual layers and then
# aborts during term reconstruction — see `extract::BigTreeAdditiveCost`.
# Already in the lockfile via egglog itself, so this adds no new dependency.
num = "0.4"
