[package]
name = "plow-asset"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-util = []

# Shared, deserialize-able schema for the compiled artifacts `plowc` emits
# (`weights.json`, `*.map.json`, and the `*.request_io.json` / `*.blocks.json` /
# `*.experts.json` sidecars). `plowc`'s own structs are `Serialize`-only and use
# `&'static str` fields, so the runtime can't reuse them directly; these owned
# mirrors carry `Deserialize`, and `tests/roundtrip.rs` guards against drift.

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
packet = { path = "../packet" }
minijinja = { version = "2", default-features = false, features = ["builtins", "loop_controls", "macros", "multi_template", "adjacent_loop_items", "preserve_order", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
