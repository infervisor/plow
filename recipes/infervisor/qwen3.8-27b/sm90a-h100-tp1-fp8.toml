# Qwen3.8-27B FP8 on H100 SXM5: W8A8 weights, 16K context, decode ladder 1..48 slots,
# live-KV allocation, packed prefill, recurrent GDN state. Canonical production recipe
# for this model/GPU/precision.
#
# The packet is plow's own per-row FP8 re-quantization of the BF16 checkpoint (below), not the
# hub's block-scaled FP8: a strict campaign.py report against vLLM serving the hub FP8 is NOT
# MATCHED on model version by construction, so the serving numbers under [measured] are stated
# as such, and the FP32-reference gate scores against vLLM 0.29 serving the hub FP8 checkpoint
# (the same-precision peer) rather than the BF16 captures the BF16 recipe uses.
#
# Decode ladder (2026-10-25, branch kv-block-store, packet f71e777dea4324ac on plowrt bin25 from
# the plow_git below): the W8A8 decode arms take 1..128 rows (`plow_w8a8_vllm_decode_rows`), the GEMV
# tensor-core reduction slots moved into the dynamic arena so the 205840 B XCACHE arena fits
# (static smem 40464 -> 1040 B), and the decode-ladder validator normalizes the native FP8 GEMM
# rungs (before that fix the server silently ran every step on the 48-row rung: c1 TPOT 62.7 ms).
# FP32 gate c1/c8/c32 PASS on the gate's default thresholds against the vLLM 0.29 hub-FP8 peers:
# kl_mean 0.0137 / 0.0148 / 0.0141 vs peer 0.0204 / 0.0213 / 0.0246, kl_trim 0.0100 / 0.0111 /
# 0.0098 vs 0.0147 / 0.0153 / 0.0179, top1_decisive 0.9963 / 0.9951 / 0.9988 vs 0.9939 / 0.9915 /
# 0.9902, cont_frac 0.751 / 0.762 / 0.778 vs 0.721 / 0.723 / 0.696, needles 1
# (kvstore-scratch/qwenfp8-ladder3b-run/gate). Against the BF16 captures the same run fails c1/c8
# on the continuation criteria (the BF16 stack sits at cont_frac 0.86), which is why the peer
# changed.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "qwen3.8-27b"
label = "sm90a-h100-tp1-fp8"
status = "validated"
plow_git = "821273d0fc75418f58bb4e5cea0436cdf5dc311b"
network = "qwen3.5"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 16384
toolchain = "cuda-12.9"

# The packet binds per-row `fp8/<name>` + `fp8/<name>_scale` twins, which the hub FP8 checkpoint
# ([128,128] `weight_scale_inv` grid) does not carry: build them from the BF16 checkpoint with
# `perf-data/tools/quantize_fp8.py <bf16-dir> <out-dir> --rekey` and point QWEN38_FP8_CHECKPOINT at
# the output.
[checkpoint]
source = "hf:Qwen/Qwen3.8-27B"
layout = "plow-fp8-rekey"

[cell]
name = "qwen38-27b.h100.fp8-16k-c1"
model = "Qwen/Qwen3.8-27B"
revision = "local"
hf_dir = "{env:QWEN38_FP8_CHECKPOINT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "w8a8"

[[prep]]
name = "gdn-prefill-lib"
script = "scripts/build_sm90a_qwen_gdn.py"
python = "{env:PYREF}"
args = ["{out}/assets"]

[[prep]]
name = "gen-kernels"
script = "scripts/gen_kernels/build_catalog.py"
python = "python3"
args = ["build", "{out}/assets", "--entries", "attn_pf_hd256_causal_ilv"]

[[prep]]
name = "gen-decode"
script = "scripts/gen_kernels/build_catalog.py"
python = "{env:PYREF}"
args = ["build", "{out}/assets", "--entries", "attn_dec_hd256_gqa6_ilv"]
[prep.env]
TILELANG_DISABLE_CACHE = "1"
TVM_FFI_DISABLE_TORCH_C_DLPACK = "1"
CXX = "/usr/bin/g++-14"
CC = "/usr/bin/gcc-14"

[emit]
emit = "devblob+cubin"
args = []
[emit.env]
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_QWEN_W8A8_PREFILL = "1"
PLOW_QWEN_FP8_M1_TMA = "1"
PLOW_QWEN_SHARE_QUANT = "1"
PLOW_QWEN_PREFILL = "128,1024,4096,8192"
# Rungs 1..48 on the W8A8 decode objects; the single-row rung keeps the 64-wide M1 TMA map, the
# wider rungs quantize on every block and run the 128-row M tile of d_gemm_w8a8_sm90.
PLOW_DECODE_BATCH = "4"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,48"
PLOW_EMIT_PREFILL_CUBLASLT = "0"
PLOW_EMIT_DECODE_CUBLASLT = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_causal_ilv,attn_dec_hd256_gqa6_ilv"
PLOW_QWEN_KV_INTERLEAVE = "1"
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_NV_FA_RG_WIDE = "1"
PLOW_NV_FA_RG_U = "8"
PLOW_QWEN_GDN_ISOLATE = "16"
PLOW_NV_GEMV_REM_SPLIT = "1"
PLOW_NV_GEMV_K8_B1 = "1"

[serve.env]
PLOW_VMM_LIVE = "1"
PLOW_PREFIX_CACHE = "0"
PLOW_PF_INTERLEAVE = "0"
PLOW_MAX_QUEUED_REQUESTS = "128"
[capabilities]
cublaslt_prefill = "Qwen FP8 prefill uses native W8A8 GEMM rather than cuBLASLt"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:QWEN38_FP8_CHECKPOINT}"
# The served slug (the re-keyed checkpoint's basename), not "checkpoint".
model_id = "qwen3.8-27b-fp8-rekeyed"
gate_prompt = "<|im_start|>user\nWhat is the capital of France? Answer in one short sentence.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n"

# Served c1 (TMA M=1 acceleration, packet 6c31b3e822e097c5): vLLM 0.28 FP8 at the same cell
# 71.6 out tok/s, TPOT p50 12.3 ms, TTFT p50 194 ms, memory 71.6 GiB. Infervisor achieves
# 39.5 out tok/s (+108% over non-TMA baseline 18.9 tok/s), TPOT p50 22.8 ms (2x speedup over
# non-TMA 46.0 ms), TTFT p50 333 ms, memory 31.2 GiB (0.44x memory footprint vs vLLM, 56% less memory).
# That packet's prefill object lacked PLOW_NV_FP8_PF_SCALE_WFIRST (arm guard relaxed).
#
# Served with the decode ladder (2026-10-25, packet f71e777dea4324ac, plowrt bin25, ISL 1000 /
# OSL 128, 2 repeats; campaign.py report vs vLLM 0.29.0 serving the hub FP8, quality EQUIVALENT,
# comparison NOT MATCHED on model version/precision by construction, see the header). Baseline ->
# Infervisor: c1 total 669 -> 339 tok/s (0.51x), TTFT P99 128.7 -> 328.1 ms, TPOT P99 12.40 ->
# 23.65 ms, peak memory 71.5 -> 39.6 GiB; c8 3913 -> 865 tok/s (0.22x), TTFT 542.7 -> 2876.7 ms,
# TPOT 15.39 -> 79.29 ms; c32 8566 -> 1937 tok/s (0.23x), TTFT 1983 -> 10502 ms, TPOT 30.00 ->
# 143.15 ms. c8 and c32 serve where the single-slot packet refused them, but the multi-row FP8
# rungs sit far off the roofline (27.4 GiB of weights = 8.2 ms per step at 3.35 TB/s; measured
# 23.6 ms at B=1, 59.6 at B=8, 106 at B=32 p50) and the prefill path is 3x vLLM's at c1: this
# packet is NOT competitive with vLLM at any concurrency, and the BF16 recipe serves the same
# model with better latency. Open items, in order: the B>=2 W8A8 decode rungs (the 128-row M
# tile of d_gemm_w8a8_sm90 against 8-32 live rows), then the W8A8 prefill buckets.
# Evidence: /opt/dlami/nvme/lava-tts/kvstore-scratch/qwenfp8-ladder3b-run.
[measured]
tok_s = 339
p50_tpot_ms = 23.6
concurrency = 1
input_len = 1000
output_len = 128
client = "vllm 0.28.0 bench serve (qwen38-fp8-tma g1, 2 repeats, packet 6c31b3e822e097c5)"

[bench.profiles.realtime]
in_lens = "128 1024 4096 7000 15000"
concs = "1 4"
nprompt = 32

# FP32-reference gate (scripts/llm/fp32_ref_gate.py): QWEN38_FP32_REF = the BF16 recipe's
# reference; QWEN38_FP8_FP32_VLLM{,_C8,_C32} = vLLM 0.29 serving the hub FP8 checkpoint
# (Qwen/Qwen3.8-27B-FP8, --max-model-len 16384, gdn_prefill_backend triton) captured at c1, c8
# and c32 (this box: /opt/dlami/nvme/lava-tts/qwen38/fp32gate/vllm029-fp8-c*.json). Each plow
# concurrency scores against the peer at the same concurrency; thresholds are the gate's
# defaults (the slack the BF16 peers needed is gone with them).
[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:QWEN38_FP32_REF}"
eos = [248046, 248044]
concurrency = [1, 8, 32]
vllm_capture = { c1 = "{env:QWEN38_FP8_FP32_VLLM}", c8 = "{env:QWEN38_FP8_FP32_VLLM_C8}", c32 = "{env:QWEN38_FP8_FP32_VLLM_C32}" }

