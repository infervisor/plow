# Chatterbox (ResembleAI/chatterbox, English) on H100: the T3 guided speech LM
# (tts.guided_lm.v1: CFG pairs, prompt tables and voices as in.prompt.* packet tensors, text
# rules as packet strings) + S3Gen lowered to s3gen.pkt (conformer encoder, 10 CFG Euler steps,
# HiFT vocoder). Every stage is a plowc packet.
#
#   PLOW_CAMPAIGN_NO_NIX=1 (this box only) CBX_PY=<python with chatterbox-tts 0.1.7> \
#   python3 scripts/campaign/campaign.py build recipes/infervisor/chatterbox/sm90a-h100-tp1.toml --out <fresh dir>
#
# Gates: T3 last-prefill logits vs fp32 (crates/plowrt/examples/t3_check.rs), s3gen mel rel-L2 vs
# torch (scripts/tts/s3gen_packet_check.py, ~1e-6), Whisper CER (median 0.000).

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "chatterbox"
label = "sm90a-h100-tp1"
network = "llama"
doc = "docs/runtime/tts.md"
tracker = "plans/tts-veena-chatterbox-h200-tracker.md"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:ResembleAI/chatterbox"

[cell]
name = "chatterbox-h100"
# The Llama-shaped T3 checkpoint + voice rows the first prep step writes.
hf_dir = "{out}/prep/t3"
gpu = "h100"
arch = "sm_90a"
n_cu = 132
n_gpu = 1
max_ctx = 2048

[[prep]]
name = "t3-checkpoint"
script = "scripts/tts/chatterbox_prep.py"
python = "{env:CBX_PY}"
args = ["{out}/prep/t3"]
env = { PYTHONPATH = "" }

[[prep]]
name = "s3gen-export"
script = "scripts/tts/s3gen_export.py"
python = "{env:CBX_PY}"
args = ["{out}/prep/s3gen"]
env = { PYTHONPATH = "" }

[emit]
emit = "devblob+cubin"
# The OpenAI `model` id plowrt serves the bundle under (weights.json served_name).
args = ["--served-name", "chatterbox"]
[emit.env]
PLOW_TTS_VOCODER_DIR = "{out}/prep/s3gen"
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
# Speech-shaped rungs: prefill rows = voice rows + text + 2 (~200-350), so 128/256/384/512;
# decode 1..32 slots = 16 concurrent requests as CFG pairs.
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "256,384"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"

[bench]
kind = "speech"
client = "scripts/tts/tts_bench.py"
arms = ["--conc 1 --stream --wav --n 16 --prompt-set chatterbox --voice default", "--conc 1 --n 16 --prompt-set chatterbox --voice default --tag full_c1", "--conc 8 --stream --n 32 --prompt-set chatterbox --voice default", "--conc 8 --n 32 --prompt-set chatterbox --voice default --tag full_c8"]
reference = "scripts/tts/chatterbox_ref.py"
