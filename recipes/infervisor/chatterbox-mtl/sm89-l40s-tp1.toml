# Chatterbox Multilingual V3 (ResembleAI/chatterbox t3_mtl23ls_v3 + s3gen_v3, 23 languages) on L40S
# (sm_89, 142 SMs, 48 GB): the H100 recipe minus the Hopper-only knobs (dense tune, S3Gen 3xFP16
# cached attention on the sm_90 speech object) and the wgmma `_gw` rungs past 32. T3 prefill
# projections go through cuBLASLt; S3Gen runs as s3gen.pkt on the sm_89 speech object.
#
#   CBX_PY=<python with upstream chatterbox (mtl_tts v3)> PYREF=<python with transformers + jiwer +
#   librosa> nix develop --command python3 scripts/campaign/campaign.py build \
#     recipes/infervisor/chatterbox-mtl/sm89-l40s-tp1.toml --out <fresh dir>
#
# Gates: Whisper CER median 0.000 (n=32; worst language fr 0.148, limit 0.2), S3Gen mel rel-L2
# 1.4e-5. T3 decode ctx 1024 B=1/16/32 2.20/4.54/7.03 ms = 62/81/87% of the roofline; streaming
# c1 TTFA 175 ms, RTF 0.17; c8 23.9 audio s/s (docs/runtime/l40s-recipes.md).

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "chatterbox-mtl"
label = "sm89-l40s-tp1"
plow_git = "96a57c7db00376288e11b511984d92eab7923c6f"
network = "llama"
doc = "docs/runtime/tts.md"

[target]
vendor = "nvidia"
isa = "sm_89"
sku = "L40S"
units = 142
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:ResembleAI/chatterbox"
revision = "5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18"

[cell]
name = "chatterbox-mtl-l40s"
hf_dir = "{out}/prep/t3"
gpu = "l40s"
arch = "sm_89"
n_cu = 142
n_gpu = 1
max_ctx = 2048

[[prep]]
name = "t3-mtl-checkpoint"
script = "scripts/tts/chatterbox_mtl_prep.py"
python = "{env:CBX_PY}"
args = ["{out}/prep/t3", "--t3", "t3_mtl23ls_v3.safetensors"]
env = { PYTHONPATH = "" }

[[prep]]
name = "s3gen-v3-export"
script = "scripts/tts/s3gen_export.py"
python = "{env:CBX_PY}"
args = ["{out}/prep/s3gen", "--weights", "s3gen_v3.safetensors"]
env = { PYTHONPATH = "" }

[emit]
emit = "devblob+cubin"
args = ["--served-name", "chatterbox-mtl"]
[emit.env]
PLOW_TTS_VOCODER_DIR = "{out}/prep/s3gen"
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
# Prefill rows = voice rows + text + 2; decode 1..32 slots = 16 requests as CFG pairs.
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "256,384"
# Decode ladder to the 128-row clamp: slots are the widest rung and `auto` picks the rung per
# tick. Rungs past 32 take ceil(B/32) mma walks, so their projections (and lm_head) run on
# cuBLASLt from 64 rows, reading the weights once: same T3 shapes as Chatterbox: B=64/128 12.86/24.16 -> 12.38/22.44 ms.
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64,128"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "64"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"
PLOW_FUSE_KV_HNR = "1"

[bench]
kind = "speech"
client = "scripts/tts/tts_bench.py"
arms = ["--conc 1 --stream --wav --n 24 --prompt-set chatterbox-mtl --voice default", "--conc 16 --stream --n 48 --prompt-set chatterbox-mtl --voice default"]

[gates]
python = "{env:PYREF}"
[gates.tts_cer]
arms = ["--conc 1 --stream --wav --n 16 --prompt-set chatterbox-mtl --voice default", "--conc 8 --stream --wav --n 16 --prompt-set chatterbox-mtl --voice default", "--conc 32 --stream --wav --n 32 --prompt-set chatterbox-mtl --voice default"]
cer_median_max = 0.05
cer_lang_max = 0.2
[gates.s3gen_rel_l2]
python = "{env:CBX_PY}"
env = { PYTHONPATH = "" }
args = ["--s3gen-weights", "s3gen_v3.safetensors"]
rel_l2_max = 1e-3
timeout_s = 1800
