# Chatterbox Multilingual V3 (ResembleAI/chatterbox t3_mtl23ls_v3 + s3gen_v3, 23 languages) on H100:
# the English Chatterbox pipeline (tts.guided_lm.v1 T3 with CFG pairs + s3gen.pkt) with the
# multilingual text frontend as packet data (text rules per language + the text_tables.v1 section:
# pkuseg CRF + Cangjie for zh, kakasi dictionary for ja). Requests select the language with
# `"language": "<ISO 639-1>"` (default en). Every stage is a plowc packet.
#
#   PLOW_CAMPAIGN_NO_NIX=1 (this box only) CBX_PY=<python with upstream chatterbox (mtl_tts v3)> \
#   python3 scripts/campaign/campaign.py build recipes/infervisor/chatterbox-mtl/sm90a-h100-tp1.toml --out <fresh dir>
#
# Gates: text ids vs the reference frontend (crates/plowrt/examples/t3_text_check.rs +
# scripts/tts/mtl_text_ref.py), T3 last-prefill logits vs fp32 (t3_check.rs + t3_mtl_ref.py),
# s3gen mel rel-L2 vs torch (s3gen_packet_check.py --s3gen-weights s3gen_v3.safetensors), Whisper
# CER per language (asr_check.py, language-aware) next to the reference's own CER.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "chatterbox-mtl"
label = "sm90a-h100-tp1"
plow_git = "1972fa37ac7a6f632cd5ece0b32fe37ab76eec75"
network = "llama"
doc = "docs/runtime/tts.md"
tracker = "docs/runtime/h100-speech-recipes.md"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:ResembleAI/chatterbox"
revision = "5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18"

[cell]
name = "chatterbox-mtl-h100"
hf_dir = "{out}/prep/t3"
gpu = "h100"
arch = "sm_90a"
n_cu = 132
n_gpu = 1
max_ctx = 2048

[[prep]]
name = "t3-mtl-checkpoint"
script = "scripts/tts/chatterbox_mtl_prep.py"
python = "{env:CBX_PY}"
args = ["{out}/prep/t3", "--t3", "t3_mtl23ls_v3.safetensors"]
env = { PYTHONPATH = "" }

[[prep]]
name = "s3gen-v3-export"
script = "scripts/tts/s3gen_export.py"
python = "{env:CBX_PY}"
args = ["{out}/prep/s3gen", "--weights", "s3gen_v3.safetensors"]
env = { PYTHONPATH = "" }

[emit]
emit = "devblob+cubin"
args = ["--served-name", "chatterbox-mtl"]
[emit.env]
PLOW_TTS_VOCODER_DIR = "{out}/prep/s3gen"
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
# Same rungs and knobs as the English recipe: T3 has the same shape (only the text table grows
# 704 -> 2454 rows, a host table).
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "256,384"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,48,64,96,128"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"
PLOW_FUSE_KV_HNR = "1"
# Opt-ins measured on this model: packed prefill at hd64/hd128, and the dense hd <= 128 decode
# tuning (gemv_k8 + L2 prefetch, tensor-core decode scores, classic B=1 GEMVs below K 3840).
PLOW_EMIT_PACKED_PREFILL_SMALL_HD = "1"
PLOW_NV_DENSE_TUNE = "1"
# S3Gen cached attention on 3xFP16 with pre-formatted voice caches (sm_90 speech object).
PLOW_EMIT_S3GEN_ATTN_H16 = "1"

[bench]
kind = "speech"
client = "scripts/tts/tts_bench.py"
arms = ["--conc 1 --stream --wav --n 24 --prompt-set chatterbox-mtl --voice default", "--conc 1 --n 24 --prompt-set chatterbox-mtl --voice default --tag full_c1", "--conc 16 --stream --n 48 --prompt-set chatterbox-mtl --voice default", "--conc 16 --n 48 --prompt-set chatterbox-mtl --voice default --tag full_c16"]
reference = "scripts/tts/chatterbox_mtl_ref.py"

# `campaign.py gate <recipe> --assets <dir> --out <dir>`. Whisper CER per language: median 0.000
# (n=32), worst language fr 0.148 at 820aa3ba. CBX_PY: upstream chatterbox (mtl_tts v3).
[gates]
python = "{env:PYREF}"
[gates.tts_cer]
arms = ["--conc 1 --stream --wav --n 16 --prompt-set chatterbox-mtl --voice default", "--conc 8 --stream --wav --n 16 --prompt-set chatterbox-mtl --voice default"]
cer_median_max = 0.05
cer_lang_max = 0.2
[gates.s3gen_rel_l2]
python = "{env:CBX_PY}"
env = { PYTHONPATH = "" }
args = ["--s3gen-weights", "s3gen_v3.safetensors"]
rel_l2_max = 1e-3
timeout_s = 1800

# VMM prefix cache off: requested on (c240cf01) it cost 9-10% of served throughput at c200 on H100
# (tts_bench c200 --n 800 stream, same lease, h100-speech 09e53e76: VMM on 70.1 / 71.9 aps, TTFA
# p50 6.57 s; off 77.7 / 78.3 aps, TTFA p50 6.30 s; the e53e48f4 bundle 77.3 off -> 71.5 forced on).
# c1 unchanged (8.1 aps, TTFA 134-136 ms).
[serve.env]
PLOW_VMM_PREFIX = "0"
