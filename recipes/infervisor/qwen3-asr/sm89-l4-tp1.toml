# Qwen3-ASR-1.7B on L4 (sm_89, 58 SMs): the H100 recipe minus the Hopper-only decode knobs (gemv_k8,
# FA fold, dense tune) and the wgmma `_gw` rungs past 32. Decoder prefill projections go through
# cuBLASLt (bf16, segment_roles sm89 policy). Co-served with the other L4 ASR models on one 24 GB
# card (scripts/asr/nvidia/l4_asr_deploy.sh).
#
#   nix develop --command python3 scripts/campaign/campaign.py build \
#     recipes/infervisor/qwen3-asr/sm89-l4-tp1.toml --hf-dir <Qwen3-ASR-1.7B dir> --out <fresh dir>
#
# Gate: WER on the 73-clip LibriSpeech dummy set (scripts/asr/nvidia/get_audio.py), served
# through plowrt = 3.652% (c1) / 3.826% (c16).

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "qwen3-asr"
label = "sm89-l4-tp1"
plow_git = "194e867f3fb91879d465e4d02728b5a146aad823"
network = "qwen3"
doc = "docs/runtime/asr.md"

[target]
vendor = "nvidia"
isa = "sm_89"
sku = "L4"
units = 58
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:Qwen/Qwen3-ASR-1.7B"
revision = "7278e1e70fe206f11671096ffdd38061171dd6e5"

[cell]
name = "qwen3-asr-l4"
hf_dir = "{hf:Qwen/Qwen3-ASR-1.7B@7278e1e70fe206f11671096ffdd38061171dd6e5}"
gpu = "l4"
arch = "sm_89"
n_cu = 58
n_gpu = 1
max_ctx = 2048

[emit]
emit = "devblob+cubin"
args = ["--served-name", "qwen3-asr"]
[emit.env]
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "256,384"
# 16 slots x 2048 ctx = 3.5 GiB of KV, so every ASR model (Qwen 1.7B + 0.6B + Nemotron) shares
# one 24 GB L4; the CLI still needs prompt + the whole 1024-token budget in context.
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"
# Packed prefill (several requests' prompts per launch; weights read once): 1.7B c16 RTFx
# 74.1 -> 85.2, WER unchanged. The packed-request objects build for Ada (PLOW_NV_ADA).
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_EMIT_PACKED_PREFILL_SMALL_HD = "1"
# Packed encoder buckets up to 64 chunks (64 s of audio): the 192-chunk default's shared FP32
# activations take ~5.7 GB, which does not leave room for a second model on a 24 GB L4.
PLOW_ASR_PACKED_MAX_CHUNKS = "64"

[bench]
kind = "asr"
client = "crates/plowrt/examples/asr/packet_dataset.rs"
manifest = "scripts/asr/nvidia/get_audio.py"
reference = "scripts/asr/nvidia/ref_bench.py"

[gates]
python = "{env:PYREF}"
[gates.asr_wer]
manifest = "{env:ASR_MANIFEST}"
conc = "1,16"
wer_max = 0.045

# VMM-backed KV prefix cache on every request path (sessions, shared system prompts, replays).
[serve.env]
PLOW_VMM_PREFIX = "1"
