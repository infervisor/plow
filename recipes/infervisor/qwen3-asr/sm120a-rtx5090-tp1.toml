# Qwen3-ASR-1.7B on RTX 5090 (GB202 sm_120a, 170 SMs, 32 GB GDDR7): the L40S recipe's contract
# (sm89-l40s-tp1.toml) on the sm_120a objects, 128 slots, the speech encoder as a packed sidecar.
#
#   nix develop --command python3 scripts/campaign/campaign.py build \
#     recipes/infervisor/qwen3-asr/sm120a-rtx5090-tp1.toml --out <fresh dir>
#
# Gate: WER on the 73-clip LibriSpeech dummy set = 3.739% (c1, c16, c64). Decode ctx 1024
# B=1/16/32 = 83/86/81% of the 1672 GB/s roofline. Served vs vLLM 0.31.0 on the same box and
# client (73 clips at c1/c16, the 292-clip x4 set at c64/c128; driver 595.91), mean of 2
# interleaved reps: c1 p50 63 vs 100 ms; RTFx c16 489 vs 422, c64 1026 vs 693, c128 1055 vs 826
# (c128 p90 1057 vs 1271 ms).

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "qwen3-asr"
label = "sm120a-rtx5090-tp1"
plow_git = "90e8df0729cccb0d5423977cdba4968ca832e312"
network = "qwen3"
doc = "docs/runtime/asr.md"

[target]
vendor = "nvidia"
isa = "sm_120a"
sku = "RTX 5090"
units = 170
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:Qwen/Qwen3-ASR-1.7B"
revision = "7278e1e70fe206f11671096ffdd38061171dd6e5"

[cell]
name = "qwen3-asr-rtx5090"
hf_dir = "{hf:Qwen/Qwen3-ASR-1.7B@7278e1e70fe206f11671096ffdd38061171dd6e5}"
gpu = "5090"
arch = "sm_120a"
n_cu = 170
n_gpu = 1
# 128 slots x 2048 ctx = 28 GiB of KV does not fit 32 GB. The audio_lm geometry needs a 30 s clip
# (391 rows) + output.max_tokens 1024 = 1415 <= max_ctx. 1536 does not fit on driver 580 (CUDA
# 13.0 takes 314 MiB more than 13.2): served at 1472 the card holds 31224 of 32109 usable MiB, and
# 1536 adds 896 MiB of KV.
max_ctx = 1472

[emit]
emit = "devblob+cubin"
args = ["--served-name", "qwen3-asr"]
[emit.env]
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
# sm_120a defaults to single-segment prefill (plowc effective_uniseg); cuBLASLt prefill and the
# packed-request objects need segmented prefill programs, as on sm_89.
PLOW_UNISEG = "0"
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "256,384"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64,128"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "64"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"
PLOW_NV_FA_FOLD = "1"
# Claim-ahead L2 weight prefetch: step_bench ctx 512 B=1/8/16/32 2.977/3.221/3.777/4.287 ->
# 2.722/3.091/3.469/4.270 ms, token digests unchanged; 16/32/128/256 KiB budgets no better.
PLOW_GEMV_PREFETCH = "1"
# The claim-ahead prefetch also takes the AddNorm (8) / HeadNormRope (16) rows and the hd128
# FlashDecode KV head (32); AddNorm folds into the GEMVs around it. step_bench ctx 1024
# B=1/4/16/32 (3 reps): 2.673/2.987/3.990/5.340 -> 2.555/2.695/3.703/5.336 ms, token digests
# unchanged. PLOW_DECODE_HNR_FOLD = "32" takes B=32 to 5.177 but its object costs the unfolded
# rungs ~1% (B=16 3.750).
PLOW_NV_GEMV_PF_OPS = "63"
PLOW_DECODE_NORM_FOLD = "1"
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_EMIT_PACKED_PREFILL_SMALL_HD = "1"
# 192-chunk packed encoder buckets (~5.7 GB of FP32 activations) + 21 GiB of KV exceed 32 GB;
# 64 chunks (64 s of audio) as on the L4.
PLOW_ASR_PACKED_MAX_CHUNKS = "64"

[bench]
kind = "asr"
client = "crates/plowrt/examples/asr/packet_dataset.rs"
manifest = "scripts/asr/nvidia/get_audio.py"
reference = "scripts/asr/nvidia/ref_bench.py"

[gates]
python = "{env:PYREF}"
[gates.asr_wer]
manifest = "{env:ASR_MANIFEST}"
conc = "1,16,64"
wer_max = 0.045

[serve.env]
# VMM-backed KV prefix cache on every request path (sessions, shared system prompts, replays).
PLOW_VMM_PREFIX = "1"
# With 32+ requests in flight, a packed encode short of 64 chunks waits up to 50 ms for more
# audio: fewer, fuller launches. RTFx c1/c16/c64/c128 87.6/501/856/950 -> 87.5/503/1025/1074,
# c128 p90 1290 -> 1040 ms, WER unchanged (2 interleaved reps).
PLOW_ASR_ENCODE_HOLD_MS = "50"
