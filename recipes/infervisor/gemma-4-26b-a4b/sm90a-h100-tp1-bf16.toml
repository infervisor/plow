# Gemma-4-26B-A4B-it BF16 weights, BF16 KV, 16384 context, 32 decode slots, prefix cache on, one
# H100 SXM5. Production recipe for this model/GPU/precision.
#
# Checkpoint: google/gemma-4-26B-A4B-it @ 4d7ae4984b7db7de8f8457170b3f1a419ee76d52.
#   PLOW_CAMPAIGN_NO_NIX=1 (box without nix only) HF26=<that snapshot> \
#   python3 scripts/campaign/campaign.py build recipes/infervisor/gemma-4-26b-a4b/sm90a-h100-tp1-bf16.toml --out <fresh dir>
#
# Qualified: FP32-reference gate PASS; strict production mix vs vLLM 0.29 MATCHED + EQUIVALENT.
# Summary: perf-data/campaign/gemma26b-h100-20261007/comparison.md.
# Routes: decode rungs 16/32 run dense projections on cuBLASLt; generated sliding prefill attention from rung 128.
schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-26b-a4b"
label = "sm90a-h100-tp1-bf16"
status = "validated"
plow_git = "b224f22feeed735bbd3b367a6f14591fdb191d8c"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 16384
toolchain = "cuda-12.9"

[checkpoint]
source = "hf:google/gemma-4-26B-A4B-it"
revision = "4d7ae4984b7db7de8f8457170b3f1a419ee76d52"
layout = "hf"

[cell]
name = "gemma4-26b-a4b.h100.bf16-16k-c32"
model = "google/gemma-4-26b-a4b-it"
revision = "4d7ae4984b7db7de8f8457170b3f1a419ee76d52"
hf_dir = "{env:HF26}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "bf16"

[emit]
args = ["--segmented", "--served-name", "gemma-4-26b-a4b-it"]
[emit.env]
PLOW_TMA_GEMM = "1"
PLOW_FA_MMAQK = "3"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "0"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "16"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
NVCC_APPEND_FLAGS = "-DPLOW_NV_RAW_NARROW=1 -DPLOW_NV_INST_PRELOAD=1 -DPLOW_NV_ROUTER_V8=1 -DPLOW_NV_TOPK_V4=1 -DPLOW_NV_ROUTER_V9=1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = [
  "interp_sm90a_pfattn_hd512.cubin",
  "interp_sm90a_pfattn_hd256_gqa2_bkv32.cubin",
  "interp_sm90a_pfattn_hd256_bkv32.cubin",
  "gen_sm90a_attn_pf_hd256_sliding.cubin",
]
[objects.env]
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding"
PLOW_BUILD_FA_GQA2_PAIR = "1"
PLOW_BUILD_PFATTN_HD256_BKV32 = "1"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "1"

[emit_roles.env]
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "1"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding@128"

[serve.env]
PLOW_PREFIX_CACHE = "1"
PLOW_PF_INTERLEAVE = "0"
PLOW_VMM_LIVE_RINGS = "1"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "32"
PLOW_PF_ATTN_GEMM_MIN_ROWS = "128"
PLOW_PF_ATTN_GEMM_S32 = "1"
PLOW_VMM_PREFIX = "1"
PLOW_LT_RUNG_ALGOS = "true"
PLOW_PF_ITL_BUDGET_MS = "60"
PLOW_PF_ITL_FORCE = "0"
PLOW_DECODE_PIPELINE = "1"
PLOW_PF_ADMIT_OVERLAP = "1"
PLOW_VMM_STRICT_PUBLISH = "1"
PLOW_KV_POOL_MIB = "2048"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:HF26}"
model_id = "gemma-4-26b-a4b-it"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[measured]
tok_s = 949.0
p50_tpot_ms = 32.2
concurrency = 128
input_len = 4096
output_len = 128
client = "vllm 0.28.0 bench serve (repro_gemma26b_h100.sh st4k, 2 repeats, max_ctx 131072 packet c44a2a1f8463; st4k is unchanged across max_ctx)"

# FP32-reference gates (scripts/llm/fp32_ref_gate.py): G26_BF16_FP32_REF = 46-case reference;
# G26_BF16_FP32_VLLM_C1/_C8/_C32 = vLLM 0.29 captures at same concurrency.
[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:G26_BF16_FP32_REF}"
concurrency = [1, 8, 32]
vllm_capture = { c1 = "{env:G26_BF16_FP32_VLLM_C1}", c8 = "{env:G26_BF16_FP32_VLLM_C8}", c32 = "{env:G26_BF16_FP32_VLLM_C32}" }
timeout_s = 3600
# Measured run-to-run spread at c8/c32 across three gate runs.
kl_over_slack = 0.015
cont_decisive_drop_max = 0.0652
