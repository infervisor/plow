# Gemma-4-26B-A4B-it FP8 on one H100 SXM5: W8A8 weights, FP8 per-token-head KV, 131072 context,
# 128 decode slots, prefix cache on. Production recipe for this model/GPU/precision.
#
# Checkpoint: hub LargitData/gemma-4-26b-a4b-it-fp8 @ 2398f3b38d1b2e56d14498f7da3a74bada8cddff
# (compressed-tensors W8 per-channel / A8 dynamic per-token; shard sha256 aeb3c810..., e5efcdd2...),
# re-keyed to plow's fp8/ contract without requantizing:
#   python3 scripts/gemma4_fp8_hub_rekey.py <hub snapshot> <re-keyed dir>
#   python3 scripts/quantize_fp8_head.py <re-keyed dir> <re-keyed dir>   (PLOW_FP8_HEAD twin: writes the
#   0.74 GB model-head.safetensors beside model.safetensors; plowrt refuses a packet whose checkpoint lacks it)
#   PLOW_CAMPAIGN_NO_NIX=1 (box without nix only) PLOW_FP8_CKPT=<re-keyed dir> \
#   python3 scripts/campaign/campaign.py build recipes/infervisor/gemma-4-26b-a4b/sm90a-h100-tp1-fp8.toml --out <fresh dir>
#
# Qualified (2026-10-09, packet 5ce87bd28db1, plowrt 80097064 and its pre-rebase build, whose 26B
# step_bench digests are identical): campaign.py report MATCHED + EQUIVALENT vs vLLM 0.28 fp8_per_token_head KV
# at --max-model-len 131072, 2 repeats. FP32-reference gate PASS twice (kl_mean 0.192 / 0.201 vs vLLM
# 0.202, kl_p99 3.14 / 3.83 vs 3.73, needle 1.0). Total tok/s vs vLLM: 4K c32/c128 1.27x / 1.30x,
# 15K 1.88x / 1.92x, agentic c32/c64/c128 1.20x / 1.13x / 3.30x, 32K c1/c4/c16 2.25x / 2.18x / 2.28x,
# 128K 3.18x / 3.19x / 3.26x, latency c1 1.02x; loses latency c4 (0.95x).
# docs/bringup/results/gemma26b-h100-20261009/comparison.md.
#
# max_ctx 131072 is gated by: the long FP32 gate (20 cases to 32768 tokens; PASS once, kl_mean 0.133
# vs vLLM 0.165, kl_p99 2.86 vs 3.56; an FP32 reference past 32768 does not fit one 80 GiB GPU) and
# needles 54/54 at 8192..130000 tokens on this packet. Agentic c128 tok/s 75965 / 76154 / 66707 at
# max_ctx 16384 / 131072 / 262144 (262144 costs 12% of the KV budget to flat FP8-KV scales and RoPE
# tables); st4k / st15k / latency unchanged across max_ctx. Not run: the open-loop production mix.
#
# 2026-10-25 (branch kv-block-store): the KV block store is the only boundary storage, host tier
# auto (this recipe's default). Strict open-loop production mix vs vLLM 0.29.0 fp8 KV (Kit 2 packet
# b86ec26e4262, plowrt b779aa91, --prod-fidelity, think lognormal 10 s, 2 repeats) MATCHED +
# EQUIVALENT: 1.8 sessions/s total tok/s 1.00x, TTFT P99 369.5 -> 384.2 ms (1.04x), TPOT P99
# 32.60 -> 26.66 ms (0.82x, spread flagged); 2.7 sessions/s 1.00x / 485.2 -> 735.7 ms (1.52x;
# Infervisor repeats 952.9 / 518.5 ms) / 57.89 -> 62.89 ms (1.09x). FP32 gate PASS (kl_trim 0.118
# vs vLLM 0.1242, top1_decisive 0.9622, cont 0.5375, needle 1). With the tier off the same mix wins
# every latency row (docs/bringup/results/gemma26b-h100-20261023/comparison.md); the tier costs
# at 10 s think and wins at production's 45 s think (hit 71.7% vs 58.3%, lower TTFT and TPOT), so
# it stays auto. Evidence: /opt/dlami/nvme/lava-tts/kvstore-scratch/strict-g26-tier23.
# The re-emit from the plow_git below (packet faaebced1d4a) keeps Kit 2's `union`, `tuning` and
# weights.json byte for byte; its manifest drops the removed snapshot knobs from the serve defaults
# and excludes the new speech opcodes from every object. c16 FP32 gate PASS on it (kl_mean 0.2081
# vs vLLM 0.202, kl_trim 0.1332 vs 0.1242, over-0.1 215 vs 206, top1_decisive 0.9582, cont_frac
# 0.5389, needle 1; kvstore-scratch/gemma-final-gates/g26fp8-3).
#
# Routes: prefill projections cuBLASLt FP8 where the prefill roles pick it, native FP8 TMA GEMM
# only at K % 128 == 0; grouped MoE prefill on cuBLASLt (moe_lt W8A8 chain, ABI 6 glue); decode
# MoE experts native (MoeExpertGluGemmaFp8/DownGemmaFp8) on every rung: this packet declares no
# MOE_DECODE_CUBLASLT segment (an earlier line here said "decode MoE >= 4 rows on cuBLASLt"; that
# is the BF16 recipe's route); decode dense projections native on rungs 1..16, cuBLASLt from 32;
# generated FP8-KV prefill attention (hd256 sliding, hd512 global) from 128 rows.
schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-26b-a4b"
label = "sm90a-h100-tp1-fp8"
status = "validated"
plow_git = "2dabbe2b3f82129d4f905707080b0d2061d768f1"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 131072
toolchain = "cuda-12.9"

[checkpoint]
source = "gemma-4-26b-a4b-it-fp8"
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-26b-a4b.h100.fp8-16k-c128"
model = "gemma-4-26b-a4b-it-fp8 (compressed-tensors, re-keyed)"
revision = "local"
hf_dir = "{env:PLOW_FP8_CKPT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 131072
precision = "w8a8"

[emit]
args = ["--segmented", "--served-name", "gemma-4-26b-a4b-it-fp8"]
[emit.env]
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_FP8_KV = "1"
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"
PLOW_SEG_FA256_GQA2 = "1"
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64,128"
PLOW_EMIT_DECODE_CUBLASLT = "1"
# HELD CANDIDATE, not applied: decode rung 32 on the native FP8 GEMV, cuBLASLt from 64 (2026-10-26 route
# sweep, step_bench 48 steps
# --spread, 2 passes ABAB, plowrt 6a4b75bc, packet 62f32036d4cc vs caf6c4a47ba6): B32 ctx 1K/8K/16K
# 13.40/14.91/17.01 -> 11.55/13.50/15.34 ms (-14/-9/-10%), --same 4K
# 11.69 -> 10.09 ms; B16/B64/B128 and every prefill rung unchanged (digests identical). Measured and
# not taken: cuBLASLt from 8 (B8/B16 6.63/8.63 -> 9.17/10.54 ms) and native at 64 (B64 18.82 ->
# 46.00 ms). FP32 gates on the variant packet: c16 PASS (kl_mean 0.2118 vs vLLM 0.202, kl_trim
# 0.1406 vs 0.1242, kl_p95 0.805 vs 0.892, over 211 vs 206, top1_decisive 0.9602, cont_frac 0.538,
# needle 1); long c4 PASS (kl_mean 0.1511 vs 0.165, kl_trim 0.0991 vs 0.1011, top1_decisive 0.9555,
# cont_frac 0.408 vs 0.343, needle 1). c16 never fills rung 32, so both packets were also gated at c32
# against a vLLM 0.28 c32 peer captured with the c16 peer's serve flags (peer kl_trim 0.128, kl_p95
# 0.864, top1_decisive 0.9652, cont_decisive 0.870; its c16 recapture reproduces the c16 peer), three
# runs per arm: control caf6c4a47ba6 kl_trim 0.1434/0.1465/0.1518, kl_p95 0.882/0.905/1.138,
# top1_decisive 0.9592/0.9622/0.9572, cont_decisive 0.783/0.804/0.804 (0 of 3 PASS); variant kl_trim
# 0.1502/0.1442/0.1422, kl_p95 0.997/0.972/0.920, top1_decisive 0.9532/0.9582/0.9572, cont_decisive
# 0.783/0.826/0.783 (1 of 3 PASS). Every KL and top-1 criterion passes on all variant runs; the c32
# failures are cont_decisive (one case = 0.0217 under this recipe's c16-calibrated 0.045 margin) and
# hit the production packet too: no clear regression vs production, but no c32 PASS either. Held until a
# c32 gate policy (margin or baseline-relative acceptance) is decided. Evidence: /opt/dlami/nvme/lava-tts/route-sweep (B/g26fp8-lt64,
# B/g26fp8-lt8, B/g26fp8-lt128, gates/g26fp8-lt64, gates/g26fp8-long, gates/g26fp8-c32, gates/g26fp8-c32r, peer32).
# 2026-10-28, perf-for-accuracy rule (docs/bringup/agent-tools.md "Gate relaxation for significant
# perf gains") at c32 vs the c32 peer: gain qualifies (rung 32 -9..-14%), accuracy does not. Bounds
# kl_trim <= 0.1408, kl_p95 <= 0.950, top1_decisive >= 0.9602, cont_decisive >= 38 of 46, needle 1;
# variant runs kl_trim 0.1502/0.1442/0.1422 (0 of 3), kl_p95 0.997/0.972/0.920 (1), top1_decisive
# 0.9532/0.9582/0.9572 (0), cont_decisive 36/38/36 (1): no run within every bound -> NOT applied,
# thresholds unchanged. The production control misses the same bounds (kl_trim 0.1434/0.1465/0.1518,
# top1 0.9592/0.9622/0.9572, cont 36/37/37: 0 of 3), so at c32 this rule cannot separate the route
# from the base packet; a baseline-relative c32 criterion stays a user decision.
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "32"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"
PLOW_GEMMA_MOE_ROUTER_EXACT = "0"
# Emit-time on purpose: plowc compiles the decode interpreters (interp_sm90a{,_fp8kv,_gw}.cubin,
# whose hashes change with it) and nvcc appends this; the [objects] script builds no op_moe object.
# step_bench decode with vs without: B4/B8/B16 6.74/8.21/12.25 vs 7.15/9.36/16.24 ms, B1/B2 +1.5%.
# WPR (-DPLOW_NV_FA_WPR=1 -DPLOW_NV_FA_WPR_FP8=1, hd512 FP8-KV warp-per-row decode scores) is off: it moved the c16
# FP32 KL tail. 2026-10-16 g26-attr2 on the 9641938b plowrt, all five serve knobs, 8 + 4 runs per arm, one scorer:
# P1-only vs P1+WPR kl_p95 median 0.958 vs 1.105 (Mann-Whitney p 0.005), kl_trim_mean 0.123 vs 0.144 (p 0.001),
# kl_mean p 0.011; P1+WPR failed 6 of 12. RG8 replaces the FP8-KV decode attention body WPR tuned.
# Evidence: /opt/dlami/nvme/lava-tts/g26next/er/attr2/ATTR2.txt.
# -DPLOW_NV_FA_RG8=2: FP8-KV row-group decode item at hd256 (8 rows/warp) and hd512 (4 rows/warp) replaces those
# bodies (qualified 2026-10-15): decode step vs the WPR packet at ctx 1024/5600/16000 B1 -8..-11%, B16 -12/-16/-25%,
# B32 -12/-20/-31% (B32 ctx16000 25.95 -> 17.99 ms), VMM kv_len 4094/4095/8191 clean; probe relL2 vs FP64 identical to
# WPR at every (b, h) incl. peaky Q and ragged lengths, memcheck clean; mixed-context full-step logits: no outlier slot.
# c4 long gate 7 runs: top1_decisive mean 0.9621 vs WPR 0.9651 (5 runs), cont_decisive 0.721 vs 0.730 (Mann-Whitney
# p 0.31 / 0.64); 6 of 7 pass the 0.125 margin. Evidence: g26-pfrung REPORT.md sections 20-22 (dec/ab-rg8, ab/gl30-*).
# -DPLOW_NV_RAW_NARROW=1 -DPLOW_NV_INST_PRELOAD=1 -DPLOW_NV_ROUTER_V8=1 -DPLOW_NV_TOPK_V4=1: packed narrow-op arms,
# instruction preload, 8-wide router staging, register top-k (qualified 2026-10-16, bit-exact): decode step vs the RG8
# packet at ctx 1024/5600/16000 B1 -3.7/-3.9/-3.9%, B8 -4.5/-4.0/-3.5%, B32 -2.5/-2.3/-1.7%, token digests identical on
# all 18 rungs + VMM kv_len 4094/4095/8191; memcheck clean; FP32 short PASS (kl_mean 0.1877, top1 0.9632) and long PASS
# (0.1331, top1 0.9736; same-run control 0.1306 / 0.9671). Evidence: g26-pfrung REPORT.md section 25 (dec/ab-fin, ab/g-fin).
# -DPLOW_NV_ROUTER_V9=1: one-round router score body at B<=16 (2026-10-18, bit-exact): step_bench ctx 6144 vs the
# same recipe build without it B1 4.392/4.389, B4 6.066/5.934, B8 7.132/7.031, B16 9.617/9.473 ms, digests identical on
# B1..B128 and ctx 4094/4095/8191; replay A/B (2 interleaved rounds) TPOT p50 9.85 -> 9.79 ms, 0 errors.
# Evidence: /opt/dlami/nvme/lava-tts/g26-perf-push/g26-router (runs/gb*, replay.txt).
# -DPLOW_NV_FA_RG8S=1: the RG8 decode body streams each iteration's K/V rows and scales through a warp-private
# two-stage cp.async smem ring (launch arena 40960 -> 82560 B); same lane map and arithmetic, bit-identical.
# Qualified 2026-10-18 (g26-attn): step_bench ctx 6144 B1/B2/B4/B8/B16 4.38/5.07/6.08/7.11/9.59 -> 4.37/5.01/5.89/6.86/
# 9.02 ms (with the RG8 word-convert commit), TOK_STREAM digests identical on every rung and at VMM kv_len
# 4094/4095/4096/8191/8192 x B1/B4/B16; prod-fidelity replay 1.8/s TPOT p50/p99 10.02/20.71 -> 9.47/19.18 ms, TTFT
# p50/p99 45.2/249.3 -> 42.8/227.7 ms, 0 errors. Evidence: /opt/dlami/nvme/lava-tts/g26-perf-push/g26-attn.
NVCC_APPEND_FLAGS = "-DPLOW_MOE_FP8_DEDUP=1 -DPLOW_NV_FA_RG8=2 -DPLOW_NV_RAW_NARROW=1 -DPLOW_NV_INST_PRELOAD=1 -DPLOW_NV_ROUTER_V8=1 -DPLOW_NV_TOPK_V4=1 -DPLOW_NV_ROUTER_V9=1 -DPLOW_NV_FA_RG8S=1"
PLOW_EMIT_MOE_PF_LT = "1"
# Dense gate|up as two FP8 cuBLASLt GEMMs + Glu/Quant (qualified 2026-10-15, packet bd9c0722e368, plowrt 2dff2171):
# prefill rungs at prefix 0 128/256/1024/4096 rows 15.69/17.53/26.46/81.33 vs 17.24/18.33/30.81/96.23 ms
# (-9.0/-4.4/-14.1/-15.5%). FP32 gate PASS: kl_mean 0.1865 vs ctrl 0.1881, kl_p99 4.016 (limit 4.668), top1_decisive
# 0.9602 vs ctrl 0.9642; long gate PASS: kl_mean 0.1627 vs ctrl 0.1515 / vLLM 0.165, kl_p99 3.18, top1 0.9638.
# Evidence: g26-pfrung REPORT.md sections 6 and 13-14 (res2, ab/g-p1, ab/gl-p1).
PLOW_NO_GLU_FUSE = "1"
# Decode lm_head on rungs 1-16 reads a per-row e4m3 twin of the tied embedding (GemvFp8 + SoftCap + Argmax; the
# embedding gather, the prefill terminal and the cuBLASLt head at >= 32 rows keep bf16). Qualified 2026-10-17 on
# the kit plowrt 16c08ef8: step_bench ctx 6144 B1/B2/B4/B8/B16 4.611/5.334/6.311/7.415/9.797 -> 4.403/5.093/
# 6.120/7.162/9.614 ms, B32-128 digests identical. c16 FP32 gate 3+3 runs PASS: kl_trim_mean 0.1300/0.1307/0.1310
# vs ctrl 0.1255/0.1298/0.1422, kl_p95 0.92/0.92/0.92 vs 0.83/0.85/1.03, top1_decisive 0.960/0.959/0.960 vs
# 0.962/0.954/0.958, over 203/218/202 vs 200/202/211; c1 (deterministic) trim 0.1441 vs 0.1390, p95 0.99 vs 0.89,
# top1 0.959 vs 0.962, within every c16 limit. Prod-fidelity replay 1.8/s: TPOT p50/p99 10.55/20.52 -> 9.88/19.39 ms,
# TTFT p50/p99 45.9/247.0 -> 43.6/242.7 ms, cached 79.8%, 0 errors. A fused FP8 GemvArgmax measured slower than
# this unfused chain (B2 +0.10 ms). Evidence: /opt/dlami/nvme/lava-tts/g26-perf-push/g26-lmhead-fp8.
PLOW_FP8_HEAD = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = ["gen_sm90a_attn_pf_hd256_sliding_fp8kv.cubin", "gen_sm90a_attn_pf_hd512_fp8kv.cubin"]
[objects.env]
PLOW_BUILD_FATLITE = "1"
PLOW_BUILD_W8A8 = "1"
PLOW_BUILD_FP8KV_GEMM = "1"
PLOW_BUILD_FA_GQA2_PAIR = "0"
PLOW_BUILD_PFATTN_HD256_BKV32 = "0"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "0"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "0"
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"
# Global (hd512) prefill attention through the library route (plowrt exec/gpu/lib_attention.rs,
# docs/arch/28): FlashAttention-4's SM90 forward exported AOT into objects/libplow_fa4_hd512.so plus
# the FP8 KV page-gather objects/kv_dequant_sm90.cubin; plowrt routes every FlashPrefillFp8 hd512
# segment through it when both files sit in the packet's objects dir (byte-reproducible builds;
# the export needs PYREF with vLLM's vllm_flash_attn and the CuTe DSL). Qualified 2026-10-29 on
# lib-attn bin3 4b261f8a, packet caf6c4a47ba6: one 16000-token prompt, packed prefill chunk
# 128/512/1024/2048 2.32/0.74/0.51/0.42 -> 1.99/0.68/0.46/0.37 s (-15/-8/-8/-11%), bit-deterministic.
# FP32 gate vs same-concurrency vLLM 0.28 peers: c1 PASS kl_trim 0.1214 (peer 0.1337) p95 0.868
# (1.005) top1 0.9652 (0.9562) cont 0.8043 (0.7826); c8 PASS 0.1453 (0.1284) p95 0.919 (0.961)
# top1 0.9652 (0.9602) cont 0.8478 (0.8696); c16 PASS 0.1381 p95 1.085 top1 0.9672; c32 2 of 3 PASS:
# kl_p95 1.216/0.972/0.939 (limit 1.12 = peer 0.8945 x 1.25), kl_trim 0.151/0.146/0.134, against
# native on the same binary 3 of 3 PASS kl_p95 1.051/0.985/0.981, kl_trim 0.151/0.145/0.153 (the
# miss is the c32 re-roll, thresholds unchanged). Prod-fidelity replay 1.8/s, 2 reps, vs the vLLM
# 0.29 arm: TTFT P99 260.7 ms (0.71x), TPOT P99 22.3 ms (0.69x), throughput 1.00x, SLO 100%.
# Evidence: /opt/dlami/nvme/lava-tts/lib-attn/promo (gate-g26, ctl, prod-g26-lib).
PLOW_BUILD_FA4_HD512 = "1"

[emit_roles.env]
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "0"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"
PLOW_EMIT_MOE_PF_LT = "1"

[serve.env]
PLOW_PREFIX_CACHE = "1"
PLOW_VMM_PREFIX = "1"
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
# Pinned wide (8192 launches). The auto width objective measured TTFT p50 -20..40% but tok/s -2..3%
# at 4K c16/c32, TTFT p99 +9..16% and FP8 agentic c128 -11% tok/s (p99 3.6x): narrow 4096 launches
# cost ~8% more per row (2026-10-08 auto-vs-pin A/B, docs/bringup/results/gemma26b-h100-20261009).
PLOW_PF_INTERLEAVE = "0"
# Sliding rings mapped per admitted slot instead of 128 x 200 MiB preallocated: free device memory
# after load 26 -> 52 GiB for the KV admission budget and the prefix cache. Production chat (no
# session ids, 2.2 req/s, ~5.7K-token prompts, human think times; replay --think-median-s 45) with
# the prompt-end-only publish: cached tokens 32.7% -> 47.4%, TTFT p50 246 -> 192 ms (2026-10-13,
# /opt/dlami/nvme/lava-tts/g26-churn/ab-*). Costs per-admission ring mapping: -6% tok/s under
# prefill overload (4.5 req/s), nothing at production concurrency (0-4 running).
PLOW_VMM_LIVE_RINGS = "1"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "128"
PLOW_LT_FP8_FAST_ACCUM_MAX_K = "8192"
# Compact prefill terminal lm_head on the interpreter, not cuBLASLt (the rows=[128] terminal plan takes its own
# algorithm). 2026-10-16 g26-attr3 on the 9641938b plowrt, c16 FP32 gate, all five serve knobs, 6 runs per arm vs
# production (P1 bd9c0722 on plowrt 4386a5c2, 23 runs): this packet with the terminal on Lt failed 3 of 6
# (kl_p95 1.153), with PLOW_TERMINAL_LT=0 passed 6 of 6 (kl_p95 median 0.856; top1_decisive 0.960-0.961 vs
# production 0.957-0.964, Mann-Whitney p 0.27; trim p 0.49). Evidence: /opt/dlami/nvme/lava-tts/g26next/er/attr3/ATTR3.txt.
PLOW_TERMINAL_LT = "0"
PLOW_LT_RUNG_ALGOS = "true"
# Production-fidelity replay A/B on H100, 2026-10-17 (agentic_turns --open-loop --prod-fidelity --rate 1.8, 300 s,
# same packet cf7aadf783bf; /opt/dlami/nvme/lava-tts/g26-opt-v2-validate): budget 60 + force 0 + interleave 0 +
# strict publish = production (TTFT p50/p99 45/242 ms, TPOT 10.4/20.5 ms, cached 79.8%, goodput 100%).
# Budget 12 + PF_ITL_FORCE=1 + interleave 1024 + strict 0: TTFT p50 12.7 s, goodput 5.4%. Budget 12 alone (force 0):
# TTFT p50/p99 109/1637 ms, TPOT 20.5/31.3 ms. Strict publish off: cache-hit greedy output differed from cold on
# 12 of 15 prompts vs 7 with it on.
PLOW_PF_ITL_BUDGET_MS = "60"
PLOW_DECODE_PIPELINE = "1"
PLOW_VMM_RING_PARK = "8"
PLOW_PF_ADMIT_OVERLAP = "1"
PLOW_PF_ITL_FORCE = "0"
PLOW_VMM_STRICT_PUBLISH = "1"
# KV physical-block pool cap, also the band the block store leaves free above the pool's pressure floor. At the
# 512 MiB default the store grew into every ring the pool retired and the pool shrank it back at the next prompt
# burst: 15.5k chunk frees per 300 s cell of the production mix with the host tier on, each free a context-wide
# driver call behind which decode ticks stretched 20 -> 75 ms (TTFT/TPOT P99 1.11x/1.10x and 0.98x/0.98x vs vLLM
# 0.29 at 1.8/2.7 sessions/s with the 10 s growth hold alone). 2 GiB (2026-10-26, bin34 = 2dabbe2b, prod mix, tier
# auto, fix-g26-band2g): 2958 frees, MATCHED + EQUIVALENT, tok/s 1.00x, TTFT/TPOT P99 0.99x/0.82x and 0.92x/0.76x;
# 4 GiB: 452 frees, 0.90x/0.86x and 1.43x*/0.67x (one 961 ms cell, spread 78%), not taken.
PLOW_KV_POOL_MIB = "2048"

# Speculative decoding drafter (Gemma-4 assistant MTP, 4 layers over target layers 28/29 KV): emit = true builds span
# verify (decode objects plus their `_rs` row-slot twins) and the draft programs into the packet, draft_fp8 = "all" binds
# the per-row e4m3 twins of every draft GEMV and the head (model-mtp-fp8.safetensors), serve = true makes PLOW_SPEC=1 the
# packet's serve default. Spec runs on pure decode ticks (no prefill, nothing queued) of <= 16 verify rows.
# Qualified 2026-10-20 (g26-mtp P3, plowrt e41abda0; evidence /opt/dlami/nvme/lava-tts/g26-mtp/P3-DESIGN.md "Results",
# p3/{g1,ga,gb,gc,s1}): plain decode on the twin packet = Kit 1 (ctx 6144 B1..B128 within noise, TOK_STREAM digests
# identical); FP32 gate spec on vs off, same packet + binary: c1 kl_trim_mean 0.140-0.141 vs 0.144, c16 0.152-0.161 vs
# 0.154-0.168, long c4 PASS 3/4 vs 3/3 (one cont_decisive 13/20 vs 13.5), trimmed KL 0.090-0.098 vs 0.102-0.111;
# prod-fidelity replay vs Kit 1 (2 rounds each): TPOT p50/p99 9.41,9.52/21.96,20.81 -> bf16 drafter 4.99,4.97/16.02,16.54,
# FP8 drafter 4.65,4.67/15.61,14.23 ms; TTFT p50/p99 47.0,43.4/246.6,240.6 -> 38.9,37.2/215.2,209.5 (FP8); cached 79.8%,
# goodput 100%, 0 errors; agentic16k C32/C64/C128 within Kit 1's run-to-run spread; API smoke 37/37.
[spec]
kind = "gemma4_assistant"
draft_dir = "{env:G26_MTP_ASSISTANT}"
draft_revision = "hub 6e5aaaf4; model.safetensors sha256 006c8713b29b046e296c0f0b7c524aa9264ae07ae8b0c3888b9bc062242297ff"
shard_sha256 = "9e899298473493a366df2548e5f4398e17237394df3b9715583457718048b314"
k_max = 7
rows = [1, 2, 4, 8, 16]
draft_fp8 = "all"
emit = true
serve = true

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:PLOW_FP8_CKPT}"
model_id = "gemma-4-26b-a4b-it-fp8"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[measured]
tok_s = 951.5
p50_tpot_ms = 123.4
concurrency = 128
input_len = 4096
output_len = 128
client = "vllm 0.28.0 bench serve (repro_gemma26b_h100.sh st4k, 2 repeats, packet 5ce87bd28db1)"

# FP32-reference gates (scripts/llm/fp32_ref_gate.py; repro_gemma26b_h100.sh gate runs these):
#   llm_fp32_ref       G26_FP8_FP32_REF = the 46-case FP32 reference (prompts sha256 103024034dce0594,
#                      ref 33d40bc35d09f4d9...), G26_FP8_FP32_VLLM = the vLLM 0.28 capture against it (8a926298ee6ff3e5...)
#   llm_fp32_ref_long  G26_FP8_FP32_REF_LONG = the 20-case long-context reference to 32768 tokens
#                      (prompts sha256 0edf0983b7428138), G26_FP8_FP32_VLLM_LONG = vLLM at --max-model-len 131072
# Thresholds: fp32_ref_gate.py DEFAULTS (docs/bringup/agent-tools.md section 5) except the two
# measured c16 margins below.
[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:G26_FP8_FP32_REF}"
vllm_capture = "{env:G26_FP8_FP32_VLLM}"
concurrency = 16
timeout_s = 2400
# Measured c16 margins (2026-10-13, nine runs of the production packet 5ce87bd28db1 and its re-emit
# 2df5a8b84f05 on the d550daaf, 6af0b02c and dd373818 plowrts, one vLLM peer capture): positions
# over 0.1 nat 209-224 of 1175 against the peer's 206 (the 0.005 default is 6 positions, below the
# FP8 c16 re-roll), decisive free-run flips 35-39 cases of 46 against the peer's 37 (two cases),
# top1_decisive 0.9522-0.9632 against the peer's 0.9662 (3-14 of 1005 decisive positions; the 0.01
# default failed 2 of 9 runs by 1 and 4 positions). Every run holds kl_mean 0.195-0.231 vs 0.202,
# trimmed 0.124-0.153 vs 0.124, p95 0.91-1.08 vs 0.89, needles 18/18.
kl_over_slack = 0.02
cont_decisive_drop_max = 0.045
top1_drop_max = 0.015
[gates.llm_fp32_ref_long]
reference = "{env:G26_FP8_FP32_REF_LONG}"
vllm_capture = "{env:G26_FP8_FP32_VLLM_LONG}"
concurrency = 4
timeout_s = 7200
# Measured c4 margins (2026-10-15, 20 cases / 743 positions, one vLLM peer capture: kl_mean 0.165, top1_decisive
# 0.9605, cont_decisive_frac 0.80, 113 positions over 0.1 nat). Fourteen control runs: control 156de996 x5, P1
# 86cd362a x2, WPR8 (p1-wpr8, p1w-rec x2) x3 on the squash plowrt 03162215; p0b-base 9b7d62c51048 (gl-ctrl) and P1
# bd9c0722 (gl-p1) on 2dff2171; the production packet 5ce87bd28db1 x2 (allbuild, mmharden):
#   run          kl_mean kl_p99 over top1   cont_dec      run          kl_mean kl_p99 over top1   cont_dec
#   ctrl         0.1776  3.718  110  0.9605 0.75          ctrl-r2/r3   0.1346  1.630  108  0.9769 0.75 x2
#   ctrl-r4/r5   0.1675  3.287  102  0.9654 0.80 x2       p1           0.1430  2.714  108  0.9687 0.75
#   p1-r2        0.1367  2.030  110  0.9671 0.80          gl-ctrl      0.1515  3.204  118  0.9621 0.75
#   gl-p1        0.1627  3.180  114  0.9638 0.75          wpr8         0.1292  2.564  112  0.9654 0.80
#   wpr8-r1      0.1484  2.735  110  0.9605 0.70          wpr8-r2      0.1278  2.110  111  0.9638 0.75
#   allbuild     0.1476  3.108  112  0.9687 0.80          mmharden     0.1580  3.113  113  0.9638 0.75
# cont_decisive_frac moves in steps of one case (0.05): 0.80 x5, 0.75 x8, 0.70 x1. The previous 0.05 margin failed
# the promoted WPR8 packet once in three runs (wpr8-r1) and 1 of 14 controls; 0.125 (between two and three cases,
# clear of float rounding at a step boundary) passes all 14 and fails a 3-case drop. Trade-off: a real 1- or 2-case free-run regression is now indistinguishable from re-roll
# noise at this case count; resolving it needs more cases (a pooled second capture halves the step to 0.025).
# top1_decisive (default margin 0.01, threshold 0.9505) and kl_over (+0.01 of positions; controls +0.0067 at most)
# pass every control run unchanged.
cont_decisive_drop_max = 0.125
kl_over_slack = 0.01
