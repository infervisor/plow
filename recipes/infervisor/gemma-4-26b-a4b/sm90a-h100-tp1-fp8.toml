# Gemma-4-26B-A4B-it FP8 on one H100 SXM5: W8A8 weights, FP8 per-token-head KV, 131072 context,
# 128 decode slots, prefix cache on. Production recipe for this model/GPU/precision.
#
# Checkpoint: hub LargitData/gemma-4-26b-a4b-it-fp8 @ 2398f3b38d1b2e56d14498f7da3a74bada8cddff
# (compressed-tensors W8 per-channel / A8 dynamic per-token; shard sha256 aeb3c810..., e5efcdd2...);
# drafter: hub google/gemma-4-26B-A4B-it-assistant (model.safetensors sha256 006c8713...),
# re-keyed to plow's fp8/ contract without requantizing:
#   python3 scripts/gemma4_fp8_hub_rekey.py <hub snapshot> <re-keyed dir>
# The packet loads the published weights only (2026-10-30 rule: no plow-converted tensors; exact BF16 -> F32
# scale widening and renames are allowed). The lm_head is the published BF16 tied embedding; the drafter
# is the published BF16 assistant (model-mtp.safetensors: renames plus the exact pre_projection split).
#   PLOW_CAMPAIGN_NO_NIX=1 (box without nix only) PLOW_FP8_CKPT=<re-keyed dir> \
#   python3 scripts/campaign/campaign.py build recipes/infervisor/gemma-4-26b-a4b/sm90a-h100-tp1-fp8.toml --out <fresh dir>
#
# Qualified: campaign.py report MATCHED + EQUIVALENT vs vLLM 0.28 fp8_per_token_head KV at
# max_ctx 131072; FP32-reference gate PASS. Summary: perf-data/campaign/gemma26b-h100-20261009/comparison.md.
#
# Routes: prefill projections cuBLASLt FP8 / native FP8 TMA GEMM (K%128==0); grouped MoE prefill on cuBLASLt;
# decode MoE experts native on every rung; decode dense projections native (rungs 1..16), cuBLASLt (>=32);
# generated FP8-KV prefill attention (hd256 sliding, hd512 global) from 128 rows.
schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-26b-a4b"
label = "sm90a-h100-tp1-fp8"
status = "validated"
plow_git = "b224f22feeed735bbd3b367a6f14591fdb191d8c"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 131072
toolchain = "cuda-12.9"

[checkpoint]
source = "hf:LargitData/gemma-4-26b-a4b-it-fp8"
revision = "2398f3b38d1b2e56d14498f7da3a74bada8cddff"
sha256 = { "model-00001-of-00002.safetensors" = "aeb3c810035ce85853a1be7dd348f2f73d1417959d623a882e51522de7b1fdf1", "model-00002-of-00002.safetensors" = "e5efcdd24651d5061d49178ba88b86dac518729d25e84f1879d15570852806c6" }
draft = "hf:google/gemma-4-26B-A4B-it-assistant"
draft_sha256 = { "model.safetensors" = "006c8713b29b046e296c0f0b7c524aa9264ae07ae8b0c3888b9bc062242297ff" }
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-26b-a4b.h100.fp8-16k-c128"
model = "LargitData/gemma-4-26b-a4b-it-fp8 (compressed-tensors, re-keyed)"
revision = "2398f3b38d1b2e56d14498f7da3a74bada8cddff"
hf_dir = "{env:PLOW_FP8_CKPT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 131072
precision = "w8a8"

[emit]
args = ["--segmented", "--served-name", "gemma-4-26b-a4b-it-fp8"]
[emit.env]
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_FP8_KV = "1"
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"
PLOW_SEG_FA256_GQA2 = "1"
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64,128"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "32"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"
NVCC_APPEND_FLAGS = "-DPLOW_MOE_FP8_DEDUP=1 -DPLOW_NV_FA_RG8=2 -DPLOW_NV_RAW_NARROW=1 -DPLOW_NV_INST_PRELOAD=1 -DPLOW_NV_ROUTER_V8=1 -DPLOW_NV_TOPK_V4=1 -DPLOW_NV_ROUTER_V9=1 -DPLOW_NV_FA_RG8S=1"
PLOW_EMIT_MOE_PF_LT = "1"
PLOW_NO_GLU_FUSE = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = ["gen_sm90a_attn_pf_hd256_sliding_fp8kv.cubin", "gen_sm90a_attn_pf_hd512_fp8kv.cubin", "plow_fa4_hd512.aot"]
[objects.env]
PLOW_BUILD_FATLITE = "1"
PLOW_BUILD_W8A8 = "1"
PLOW_BUILD_FP8KV_GEMM = "1"
PLOW_BUILD_FA_GQA2_PAIR = "0"
PLOW_BUILD_PFATTN_HD256_BKV32 = "0"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "0"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "0"
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"
# Global (hd512) prefill attention through FlashAttention-4 SM90 forward AOT (objects/plow_fa4_hd512.aot; docs/arch/28).
PLOW_BUILD_FA4_HD512 = "1"

[emit_roles.env]
PLOW_EMIT_ATTN_LIBRARY = "1"
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "0"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"
PLOW_EMIT_MOE_PF_LT = "1"

[serve.env]
PLOW_PREFIX_CACHE = "1"
PLOW_VMM_PREFIX = "1"
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
PLOW_PF_INTERLEAVE = "0"
PLOW_VMM_LIVE_RINGS = "1"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "128"
PLOW_LT_FP8_FAST_ACCUM_MAX_K = "8192"
PLOW_TERMINAL_LT = "0"
PLOW_LT_RUNG_ALGOS = "true"
PLOW_PF_ITL_BUDGET_MS = "60"
PLOW_DECODE_PIPELINE = "1"
PLOW_PF_ADMIT_OVERLAP = "1"
PLOW_PF_ITL_FORCE = "0"
PLOW_VMM_STRICT_PUBLISH = "1"
PLOW_KV_POOL_MIB = "2048"
PLOW_MAX_QUEUED_REQUESTS = "4096"
PLOW_DECODE_CUBLASLT_MIN_ROWS = "64"
PLOW_SPEC_RIDE = "2"

# Speculative decoding drafter (Gemma-4 assistant MTP, 4 layers over target layers 28/29 KV).
[spec]
kind = "gemma4_assistant"
draft_dir = "{env:G26_MTP_ASSISTANT}"
draft_revision = "hub 6e5aaaf4; model.safetensors sha256 006c8713b29b046e296c0f0b7c524aa9264ae07ae8b0c3888b9bc062242297ff"
shard_sha256 = "9e899298473493a366df2548e5f4398e17237394df3b9715583457718048b314"
k_max = 7
rows = [1, 2, 4, 8, 16]
emit = true
serve = true

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:PLOW_FP8_CKPT}"
model_id = "gemma-4-26b-a4b-it-fp8"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[rung_choices.PLOW_EMIT_ATTN_LIBRARY]
label = "qualified"
evidence = ["docs/arch/28-library-attention.md"]

[rung_choices.PLOW_NO_GLU_FUSE]
label = "qualified"
evidence = ["2026-10-15 packet bd9c0722e368: FP32 + long gate PASS"]

[measured]
tok_s = 951.5
p50_tpot_ms = 123.4
concurrency = 128
input_len = 4096
output_len = 128
client = "vllm 0.28.0 bench serve (repro_gemma26b_h100.sh st4k, 2 repeats, packet 5ce87bd28db1)"

# FP32-reference gates (scripts/llm/fp32_ref_gate.py):
#   llm_fp32_ref       G26_FP8_FP32_REF = 46-case reference, G26_FP8_FP32_VLLM = vLLM 0.28 capture
#   llm_fp32_ref_long  G26_FP8_FP32_REF_LONG = 20-case long-context reference to 32768 tokens
[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:G26_FP8_FP32_REF}"
vllm_capture = "{env:G26_FP8_FP32_VLLM}"
concurrency = 16
timeout_s = 2400
# Measured c16 margins across 9 runs of production packet vs vLLM peer.
kl_over_slack = 0.02
cont_decisive_drop_max = 0.045
top1_drop_max = 0.015
[gates.llm_fp32_ref_long]
reference = "{env:G26_FP8_FP32_REF_LONG}"
vllm_capture = "{env:G26_FP8_FP32_VLLM_LONG}"
concurrency = 4
timeout_s = 7200
# Measured c4 margins across 14 control runs.
cont_decisive_drop_max = 0.125
kl_over_slack = 0.01
