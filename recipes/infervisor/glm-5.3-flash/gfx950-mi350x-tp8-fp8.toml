# GLM-5.3-Flash (glm5_next: 34 KDA + 11 NoPE sparse-MLA layers, mHC, 288x8 MoE) on 8x MI350X.
#
# The ONE production recipe for this model/GPU/precision: every context-specific choice lives in
# this file, not in per-context twins. The devblob emitter is `mla::glm53_emit_full`
# (crates/devgen/src/mla.rs). `scripts/check_recipe.py` asserts this file against what a build
# produced. Status `emits`: it compiles, builds objects and loads; the correctness and serving
# gates below are what promote it. See plans/glm53-flash-dsv41-mi350x.md for the campaign and
# docs/amd/glm53-flash-mi350x.md for the measurements behind each choice.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "glm-5.3-flash"
label = "gfx950-mi350x-tp8-fp8"
network = "glm-5.3-flash"
status = "validated"
plow_git = "8485e951f711ec1f0e743dfbb07182a016e18c02"
doc = "docs/amd/glm53-flash-mi350x.md"

# max_ctx 65536: the model's recurrent (KDA) state carries at every length, so long prompts are
# a correctness probe, not just a capacity one; the dense-MLA path (`PLOW_GLM_DSA = "0"`) serves
# below the 64k DSA crossover. The 16k packet took ~84 GiB/GPU at batch 128 (41 GiB weights);
# the 64k KV (11 layers x 128 slots x 64k x 1 KiB = 88 GiB/rank) fits the 288 GB card, 128k would
# not at this batch. Shorter contexts are the same packet: the serve engine buckets prefill at
# 128/512/2048/8192 rows and the decode ladder is context-independent.
[target]
vendor = "amd"
isa = "gfx950"
sku = "MI350X"
units = 256
num_gpus = 8
parallel = "tp"
max_ctx = 65536
toolchain = "rocm-7.14.1-nix"

# The PREPPED directory: the snapshot symlinked plus `zz-plow-glm53-derived.safetensors`, which
# carries the absorbed MLA weights (`derived.q_absorb` / `v_absorb` / `kv_a_latent`, bf16), the
# f32 mHC `hc_*_fn`, the f32 KDA conv/o_norm, the f32 indexer `weights_proj` / `ape` and the
# bf16-dequantised shared experts. Routed experts, dense FFNs and the MLA projections stay
# block-FP8 e4m3 [128,128] from the snapshot (`quantization_config` at the root of config.json).
[checkpoint]
source = "hf:zai-org/GLM-5.3-Flash"
shards = 62
layout = "plow-glm53-flash"

[tokenizer]
source = "checkpoint"

[[prepare]]
tool = "scripts/glm53_prep.py"
shell = "nix develop .#quantize"
args = ["--model", "$CKPT", "--out", "$WORK/glm53-flash-prepped"]
produces = ["zz-plow-glm53-derived.safetensors"]

# The objects take the packet's `plow_config.h` (PLOW_HSACO_CONFIG): `PLOW_K3` and the eight
# GLM-5.3-Flash opcodes (HyperConnPre/Post, DsaPool*, DsaQQuant, IndexScoreKpool, GemvF32) are
# derived from the packet's feature scan, not set here.
# `PLOW_DECODE_BATCH` is the ladder's widest rung; the wide object's GEMV body is a 4-row pass
# that `PLOW_GEMV_WALK=1` loops (rungs 32/128 run their projections as GEMM tiles, see [emit]).
# `PLOW_DECODE_TIERS = "1,8"` builds `lowrung1/` and `lowrung8/` decode objects (one GEMV pass of
# 1 and 8 rows) from the same packet config; plowrt serves rungs 1 and 8 from them. Measured
# 2026-10-12 (doc §4): the rung-1 program on the wide object stepped 51 ms, on its tier 27 ms;
# the decode object body depends on PLOW_GEMV_MM / PLOW_GEMV_WALK, not on PLOW_DECODE_BATCH, so
# a tier without its own MM is the wide object again.
# Since 819034ad/bc44e45c the same env builds the lean KDA chunk objects (intra/carry/wu), the
# value-identical MoE prefill axes and the lane-parallel mHC mix/HyperConnPre arms in the
# prefill and decode objects: prefill 1k/4k/8k/16k 147/335/599/1254 -> 112/198/361/761 ms,
# decode step r1/B8/B32/B128 27.8/47.3/57.8/84.3 -> 26.1/44.5/56.0/84.1 ms, streams unchanged.
[objects]
script = "scripts/build_gfx950.sh"
# v11: bit-identical V2 flash softmax (DPP reductions, P convert, no spills) and KDA carry schedule
# (pipelined loads, transpose key reads); streams identical, validate-v11c8.
# v13: `PLOW_K3_PF_XR_SCHED = "aiter"` (16-byte prefill collective schedule), `FA_MLA_PF2_DEFER = "1"`
# (deferred-frame flash softmax), `PLOW_MLA_PF_DENSE = "1"` (builds the dedicated NoPE MLA flash prefill
# object mla_pf_dense_gfx950.elf; the serve env routes to it), `PLOW_XR_TAG_SLOT = "90112"` (decode tag slot;
# the serve env must carry the same value or the loader refuses the objects).
env = { PLOW_DECODE_BATCH = "128", PLOW_GEMV_WALK = "1", PLOW_GEMV_MM = "4", PLOW_DECODE_TIERS = "1,8", JOBS = "32", PLOW_MLA_PF2_DPP = "1", PLOW_MLA_PF2_PCVT = "1", PLOW_KDA_CARRY_PIPE = "1", PLOW_KDA_CARRY_KTR16 = "1", PLOW_K3_PF_XR_SCHED = "aiter", FA_MLA_PF2_DEFER = "1", PLOW_MLA_PF_DENSE = "1", PLOW_XR_TAG_SLOT = "90112" }

# Dense attention at every rung (`PLOW_GLM_DSA = "0"`; the pooled-DSA batched-decode arm does not
# exist, and below the 64k DSA crossover the dense MLA path serves). The ladder rungs 32/128
# route their bf16 projections through the prefill GEMM tiles (`PLOW_GLM_DECODE_GEMM_ROWS`):
# the row-bucketed GEMV walk made a 128-row step 162 ms, the tiles 89 ms, token-identical to
# the one-row packet in the batched amd-bench (ranks agree). Rung 8 keeps its GEMVs on the
# 8-row tier (B=8 step 46 ms against 49 on the tiles). The one-row rung is unchanged.
# `PLOW_GLM_SEQ_PAR = "1"`: the mHC sequence-parallel seam on the 2048/8192 prefill buckets
# (hyper-connection ops on each rank's row band, reduce-scatter + all-gather seams): prefill
# 1k/2k/4k/8k 173/256/471/995 -> 151/212/381/806 ms, streams unchanged. `PLOW_GLM_SEQ_PAR_PROJ`
# stays off: the band projections are unvalidated with the mHC seam.
# FP32-reference gate on the 65536 packet (cap-plow-v6, prefix cache on, 2026-10-12): PASS,
# kl_mean 0.0140 (vLLM 0.0368), kl_p99 0.23 (0.55), top1_decisive 0.996 (0.987), needles 18/18.
# validate-v6: streams equal the FP32 continuation at rungs 1/8/32/128.
# `PLOW_MLA_PF_V2 = "1"` (read at emit, packet/src/devbuild.rs) isolates FlashMlaPrefill in its own
# segment, so the 2048/8192 buckets run the NoPE V2 MFMA arm on the 4-wave flash object instead of
# the scalar decode body on the 8-wave interpreter (without it the program was one segment).
# `PLOW_GLM_PF_NS = "2"` splits each (q-tile, head) item's causal range in two, as the gfx942
# GLM-5.3 recipe does; its packet requires PLOW_MLA_PF_NS=1, so objects are rebuilt for it.
# Measured 2026-10-12 (amd-bench TP8): FlashMlaPrefill at 4k 11 x 5.55 -> 11 x 1.13 ms; prefill
# 1k/4k/8k/16k/32k 167/382/803/2081/6431 -> 147/333/598/1269/2767 ms. The nat-pride-1024 and
# 4096-token synthetic streams equal v6's (ns=1 flipped the synthetic one at its second token).
# `PLOW_GLM_HC_NORM_FOLD = "1"` / `PLOW_GLM_HC_POST_FOLD = "1"` (decode programs only; prefill
# programs byte-identical): the RmsNorm after a KDA layer's and every FFN's HyperConnPre runs in
# that packet, and each HyperConnPost that a HyperConnPre follows runs inside the pre's mHC mix
# GemvF32 (rows * 24 <= 256, i.e. rungs 1 and 8). Rung 1 1846 -> 1678 packets (critical path
# 909 -> 741), rung 8 1374 -> 1206. Packet 1533860b; with the f2160842 objects (workgroup-per-
# output decode GemvF32) validate (2026-10-13, 32 steps): r1/B8/B32/B128 26.1/44.5/55.4/84.9 ->
# 24.1/42.1/54.4/82.9 ms, 4k/16k-prompt rung 1 25.6/26.4 -> 23.5/23.7 ms, every slot's stream
# byte-equal to v8b's at every rung, so the v8b FP32 gate and needles carry over.
# Objects from 76d03d94 (gfx950 K3 decode objects inline plow_exec; same [objects] env): r1/B8/B32
# 24.1/42.1/54.4 -> 12.9/31.2/53.0 ms, B128 within noise, 4k/16k r1 13.0/13.1 ms, streams equal.
[emit]
# v13 additions (each validated per rung; docs/amd/glm53-flash-mi350x.md §4):
# - `PLOW_GLM_PF_NS = "2"` kept (two causal KV splits, as built and gated); NS=1 measured slightly faster (flash 9.5
#   vs 9.9 ms per 8k chunk) with FP32 kl 0.0125 on its own build, not yet in this recipe.
# - `PLOW_GLM53_SP_ROUTER` / `PLOW_GLM_ROUTER_OVERLAP = "2"` / `PLOW_GLM53_SP_KDA_NORM`: router and KDA input norm on
#   the rank's sequence-parallel band (bit-identical).
# - `PLOW_XR_DEC_CUS = "64"`, `PLOW_GLM_DEC_SPLITK = "16"` + `PLOW_GLM_DEC_SPLITK_2P`: decode XReduce CU cap and the
#   two-packet split-K q/k/v.
# - `PLOW_MOE_PF_W8A8` + `PLOW_MOE_DEC_W8A8`: vLLM's precision — W8A8 block FP8 (per-token 1x128 activation
#   groups) for the routed MoE and the dense layers 0-2, prefill and batched decode; all attention/KDA projections
#   stay bf16 as in vLLM. Decode W8A8 costs ~4-6% at c32 vs W8A16 (screen), equal at c1/c128.
# - `PLOW_GLM_HC_FUSE_DEC`/`_R1`/`_VARIANT = "3"`, `PLOW_GLM_KDA_PROJ_GROUP`, `PLOW_GLM_KDA_QKVG_R1`: fused decode mHC
#   (post + mix + pre + norm) and grouped split-K projections (bit-identical).
# - `PLOW_KDA_PF_GROUP_GEMM`: the six KDA input projections as one routed prefill GEMM (bit-identical).
# - `PLOW_MOE_FP8_PF_LEAN`: dedicated block-FP8 grouped MoE prefill kernels (bit-identical).
# - `PLOW_GLM53_PACKED_LEAN_KDA`: packed serving prefill runs the lean KDA objects per span (bit-identical).
# v14/v15 additions (docs/amd/glm53-flash-mi350x.md §4):
# - `PLOW_GLM_HC_MIX_RAW`: standalone r1 mHC mix kernel (r1 12.15 -> 11.88 ms, bit-identical).
# - `PLOW_MOE_W8A8_DEC`: dedicated decode W8A8 grouped MoE kernels (GLU+DOWN pair), bit-identical; distinct-prompt
#   B8/B32/B128 27.6/30.1/40.4 -> 25.5/28.0/39.4 ms. `PLOW_MOE_DEC_W8_SPLITN` (default on) splits W8A8 GLU tiles.
# - KDA prefill object defines (default on, bit-identical): `PLOW_KDA_INTRA_HOIST`, `_INTRA_SOLVE_ILP`,
#   `_PREP_COLSCAN`, `_GNORM_ILP`, `_CARRY_XCD`; 8k prefill -4%.
# - `PLOW_MOE_FP8_PF_XQ` (default on): the dedicated MoE prefill kernels actually run (v13/v14 fell back to the
#   interpreter: the FQ GLU arm missed the dedicated predicate); bit-identical, 8k -12 ms.
# - `PLOW_MOE_FP8_PF_ACC` + `PLOW_GLM_MOE_SHARED_FOLD` + `PLOW_MOE_FP8_PF_PACKED`: fused weighted combine into the
#   bf16 SP band (pk_add_bf16 atomics, like AITER; run-to-run nondeterministic), shared expert as expert 288 of
#   289, and the packed serving prefill on the same dedicated segments; 8k -10 ms more. FP32-gated (below).
# v16 (docs/amd/glm53-flash-mi350x.md §4):
# - `PLOW_GLM_MOE_AITER` + `PLOW_GLM_MOE_RESIDENT`: the routed MoE (decode rungs 8/32/128 and prefill) runs vLLM's
#   own AITER gfx950 asm kernels (fmoe_bf16_blockscaleFp8_g1u1_vs_silu_1tg_{pf2_16x128,ps_32x128,ps_32x256,ps_64x256},
#   tiles from AITER's tuned GLM-5.3-Flash gfx950 table; same W8A8 1x128 precision), shared expert folded in as
#   expert 288 (289, top-9), behind a plow adapter (table sort + input quant + compact 16/32-row blocks) and a
#   direct write into the TP reduce buffer. Rung 1 keeps plow's single-row MoE on a row-major copy of the expert
#   weights (experts 35.6 -> 71.1 GiB/rank). Supersedes `PLOW_MOE_W8A8_DEC` / `PLOW_MOE_FP8_PF_ACC` (not emitted).
#   AITER accumulates with atomics: B8+ and prefill are run-to-run nondeterministic (FP32-gated below).
#   Distinct-prompt B8/B32/B128 25.5/28.0/39.6 -> 20.0/23.0/32.8 ms; prefill 8k 196.9 -> 174.2 ms.
# v17:
# - `PLOW_GLM_HC_AITER`: decode mHC on every FFN and KDA side (post and norm folded) runs AITER's fused
#   `mhc_fused_post_pre_gemm_sqrsum` + `mhc_pre_big_fuse_rmsnorm` (compiled from AITER source by
#   scripts/build_mhc_aiter.sh into mhc_aiter_gfx950.elf; 20 Sinkhorn iterations, eps 1e-6) as one raw segment;
#   MLA sides stay native. Distinct-prompt B8/B32/B128 20.0/23.0/32.8 -> 18.8/21.9/29.5 ms, r1 unchanged.
# - `PLOW_GLM_DSA = "0"`: dense attention (vLLM runs sparse
#   top-2048; plow's DSA serves but has no prefix hits / packed prefill yet).
env = { PLOW_MLA_PREFILL = "full:128,512,2048,8192", PLOW_MLA_PF_V2 = "1", PLOW_GLM_PF_NS = "2", PLOW_DECODE_BATCH_LADDER = "1,8,32,128", PLOW_GLM_DECODE_GEMM_ROWS = "32", PLOW_GLM_DSA = "0", PLOW_GLM_SEQ_PAR = "1", PLOW_GLM_SEQ_PAR_PROJ = "0", PLOW_GLM_HC_NORM_FOLD = "1", PLOW_GLM_HC_POST_FOLD = "1", PLOW_KDA_DECODE_FUSED_ARM = "1", PLOW_KDA_FB_FOLD = "1", PLOW_GLM_HC_PRE_TAIL = "1", GLM_SHARD_HEAD = "1", PLOW_GLM53_SP_ROUTER = "1", PLOW_GLM_ROUTER_OVERLAP = "2", PLOW_GLM53_SP_KDA_NORM = "1", PLOW_XR_DEC_CUS = "64", PLOW_GLM_DEC_SPLITK = "16", PLOW_GLM_DEC_SPLITK_2P = "1", PLOW_MOE_PF_W8A8 = "1", PLOW_MOE_DEC_W8A8 = "1", PLOW_GLM_HC_FUSE_DEC = "1", PLOW_GLM_KDA_PROJ_GROUP = "1", PLOW_GLM_HC_FUSE_R1 = "1", PLOW_GLM_KDA_QKVG_R1 = "1", PLOW_GLM_HC_FUSE_VARIANT = "3", PLOW_KDA_PF_GROUP_GEMM = "1", PLOW_MOE_FP8_PF_LEAN = "1", PLOW_GLM53_PACKED_LEAN_KDA = "1", PLOW_GLM_HC_MIX_RAW = "1", PLOW_GLM_MOE_SHARED_FOLD = "1", PLOW_MOE_FP8_PF_PACKED = "1", PLOW_GLM_MOE_AITER = "1", PLOW_GLM_MOE_RESIDENT = "1", PLOW_GLM_HC_AITER = "1" }
args = [
  "--emit", "devblob",
  "--arch", "gfx950",
  "--gpu", "MI350X",
  "--num-gpus", "8",
  "--parallel", "tp",
  "--max-ctx", "65536",
  "--n-cu", "256",
]

# Prefix cache ON (the runtime default; never set `PLOW_PREFIX_CACHE = "0"` here). On gfx950 it
# is the per-slot snapshot route: at a chunk boundary of each prompt the engine snapshots the
# slot's carried KDA state (34 x state + conv windows, 18 MiB/slot/rank) and resumes a prompt
# sharing that prefix from the snapshot; the MLA KV rows below the resume point are intact in
# the slot. The gfx942 shared pool (cross-slot, VMM-backed) is not built on gfx950. Probe
# 2026-10-12 (doc §4): same 1k prompt TTFT 453 -> 273 ms, 1984/4096 prompt tokens cached.
# `PLOW_STATE_CLEAR_DEVICE = "1"`: a miss clears the slot's recurrence on the device so a reused
# slot never inherits a previous sequence's state. `PLOW_DECODE_MIN_RUNG = "1"` lets one live
# request decode on the one-row rung (TP engines default to 8: c1 TPOT 51 -> 27 ms).
# `PLOW_PF_INTERLEAVE = "4096"` dispatches a decode step after at most 4096 prefill rows so
# waiting decodes do not stall behind a whole admission burst; no `PLOW_PF_CHUNK` cap — a 512-row
# cap ran every prompt as 512-bucket chunks and cost 25% of throughput at c32+ (doc §4, 17:05).
# `PLOW_PF_BACK_TO_BACK = "1"`: a tick keeps launching prefill chunks (a prompt's remaining
# chunks, then further waiting prompts) until those 4096 rows are spent; before it each prompt
# took two ticks and the c128 decode batch sat near 64 of 128 slots. `PLOW_PREFIX_ARM_END = "1"`:
# a prompt sharing no cached prefix snapshots after its last chunk instead of at a split 32 rows
# before the end, so a cold prompt is one launch (the 32-row tail cost 62 ms of ~190 at 1k).
# Continuations (prompt + reply) resume at the full prompt and a shared prefix still arms at the
# common prefix; an identical re-sent prompt resumes at its end too, taking the first token and
# logits row kept with the snapshot (no launch; c1 re-sends stream and logprob what the first did).
# Served 2026-10-13 (doc §4), total tok/s v8 -> this: isl1024 c32/c128 2427/2861 -> 3106/5199,
# isl4096 6303/6330 -> 7661/10218; TTFT p99 c128 45.4 -> 17.1 s (1k), 78.7 -> 46.7 s (4k);
# TPOT p99 c128 191 -> 213 ms (1k), 217 -> 384 ms (4k).
# `PLOW_AMD_PACKED_SEG_MAJOR = "1"` (v15b): a packed prefill chunk enqueues every segment on every rank and drains
# once, as isolated chunks already do, instead of a host drain after each segment (the dedicated MoE/KDA kernels made
# packed chunks many-segment). Same kernels, same per-rank order. Strict grid vs v15a: isl1024 c128 0.41 -> 0.43,
# isl4096 c64/c128 0.47/0.53 -> 0.50/0.57; long-context cells unchanged.
[serve]
env = { PLOW_STATE_CLEAR_DEVICE = "1", PLOW_TP_AGREE_EVERY = "1", PLOW_DECODE_MIN_RUNG = "1", PLOW_PF_INTERLEAVE = "8192", PLOW_PF_BACK_TO_BACK = "1", PLOW_PREFIX_ARM_END = "1", PLOW_MLA_PF_DENSE = "1", PLOW_XR_TAG_SLOT = "90112", PLOW_AMD_PACKED_SEG_MAJOR = "1" }

[[gates]]
name = "smoke"
cmd = "scripts/serve_test/smoke.sh"

# FP32-reference gate (scripts/llm/fp32_ref_gate.py, 46 cases incl. 18 needles to 15872 tokens,
# served c16, prefix cache on, PF_INTERLEAVE 8192) on packet 6629af02 with this [serve] env (v17): PASS,
# kl_mean 0.02239 (vLLM 0.03677 on the same reference), kl_p99 0.332 (0.549), top1_decisive 0.9923 (0.9868), needles
# 18/18; needles with PLOW_PF_CHUNK=512 18/18. Prefix reuse at c8: 57344 hit tokens. Nondeterministic route (AITER
# MoE atomics): FP32 runs of the AITER builds measured kl_mean 0.018-0.026 (all PASS). 0 cross-GPU collective errors.
[[gates]]
name = "llm_fp32_ref"
cmd = "scripts/llm/fp32_ref_gate.py"
expect = "PASS"

# Long-context needles (scripts/glm53_needle_probe.py --exact-lengths --gen-suffix '</think>',
# 4096/16384/32768/61440 tokens x depths 0.1/0.5/0.9 x 3 needles): 36/36, vLLM 36/36, paired pass.
[[gates]]
name = "needle-long-context"
cmd = "scripts/glm53_needle_probe.py"
expect = "36/36"

# One serving cell for orientation; the full grid (isl 1024/4096/16384 at c1..c128, 32768/61440 at
# c1/c8) and the strict comparison against vLLM are docs/bringup/results/glm53flash-mi350x-2026-10-12.
# No cell beats vLLM on throughput (v17: 0.47-0.76x; v16c 0.44-0.75x, v15b 0.37-0.66x, v13 0.34-0.61x, v11 0.28-0.61x); see docs/amd/glm53-flash-mi350x.md.
[measured]
tok_s = 78.23
p50_tpot_ms = 11.92
p50_ttft_ms = 118.57
concurrency = 1
input_len = 4096
output_len = 128
client = "vllm 0.31.1rc1 bench serve (scripts/bench/llm_grid.sh)"

