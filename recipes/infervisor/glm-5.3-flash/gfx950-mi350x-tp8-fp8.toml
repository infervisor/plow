# GLM-5.3-Flash (glm5_next: 34 KDA + 11 NoPE sparse-MLA layers, mHC, 288x8 MoE) on 8x MI350X.
# Canonical production recipe for this model/GPU/precision. Status: validated.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "glm-5.3-flash"
label = "gfx950-mi350x-tp8-fp8"
network = "glm-5.3-flash"
status = "validated"
plow_git = "4e8f9d6fe312535fc59e6eff8ac5fe993356c67a"
doc = "docs/amd/glm53-flash-mi350x.md"

# max_ctx 65536: recurrent (KDA) state carries at every length; dense-MLA path serves below 64k.
[target]
vendor = "amd"
isa = "gfx950"
sku = "MI350X"
units = 256
num_gpus = 8
parallel = "tp"
max_ctx = 65536
toolchain = "rocm-7.14.1-nix"

[checkpoint]
source = "hf:zai-org/GLM-5.3-Flash"
revision = "46a050bec13002ad29ee795c16e61cf4fa3c4a9c"
shards = 62
layout = "plow-glm53-flash"

[tokenizer]
source = "checkpoint"

[[prepare]]
tool = "scripts/glm53_prep.py"
shell = "nix develop .#quantize"
args = ["--model", "$CKPT", "--out", "$WORK/glm53-flash-prepped"]
produces = ["zz-plow-glm53-derived.safetensors"]

# Objects take plow_config.h (PLOW_HSACO_CONFIG) derived from packet scan.
# Wide GEMV body loops via PLOW_GEMV_WALK=1; lowrung1 and lowrung8 tiers provide narrow GEMV passes.
[objects]
script = "scripts/build_gfx950.sh"
env = { PLOW_DECODE_BATCH = "128", PLOW_GEMV_WALK = "1", PLOW_GEMV_MM = "4", PLOW_DECODE_TIERS = "1,8", JOBS = "32", PLOW_MLA_PF2_DPP = "1", PLOW_MLA_PF2_PCVT = "1", PLOW_KDA_CARRY_PIPE = "1", PLOW_KDA_CARRY_KTR16 = "1", PLOW_K3_PF_XR_SCHED = "aiter", FA_MLA_PF2_DEFER = "1", PLOW_MLA_PF_DENSE = "1", PLOW_XR_TAG_SLOT = "90112", PLOW_MLA_DEC_HPACK = "1", PLOW_KDA_DECODE_LANES = "1", PLOW_KDA_CARRY_SPLIT = "4", PLOW_KDA_CARRY_MULTI = "1" }

# Dense attention with NoPE MLA flash; rungs 8/32/64/128 route projections to hipBLASLt.
# Routed MoE uses W8A8 block FP8 (AITER asm kernels for decode and prefill); shared expert folded.
# Fused decode mHC and grouped split-K projections; sequence-parallel seam on 2048/8192 prefill.
[emit]
env = { GLM_MOE_CORESIDENT = "2", GLM_SHARD_HEAD = "1", GLM_SHARED_CUS = "64", PLOW_DECODE_BATCH_LADDER = "1,8,32,64,128", PLOW_GLM53_GEMM_LT_DEC = "q_a,kv_a,q_absorb,mla_o,kda_o,kda_qkv,kda_gfa,kda_gb,kda_b,lm_head", PLOW_GLM53_GEMM_LT_DEC_RUNGS = "8,32,64,128", PLOW_GLM53_L2_PLACE = "1", PLOW_GLM53_MLA_HPACK_ROWS = "32", PLOW_GLM53_MLA_SEG_KVW = "1", PLOW_GLM53_PACKED_LEAN_KDA = "1", PLOW_GLM53_SP_KDA_NORM = "1", PLOW_GLM53_SP_ROUTER = "1", PLOW_GLM_DECODE_GEMM_ROWS = "32", PLOW_GLM_DEC_SPLITK = "16", PLOW_GLM_DEC_SPLITK_2P = "1", PLOW_GLM_DSA = "1", PLOW_GLM_DSA_FUSE = "1", PLOW_GLM_HC_AITER = "1", PLOW_GLM_HC_FOLD_MLA = "1", PLOW_GLM_HC_FUSE_DEC = "1", PLOW_GLM_HC_FUSE_R1 = "1", PLOW_GLM_HC_FUSE_VARIANT = "3", PLOW_GLM_HC_MIX_RAW = "1", PLOW_GLM_HC_NORM_FOLD = "1", PLOW_GLM_HC_POST_FOLD = "1", PLOW_GLM_HC_PRE_TAIL = "1", PLOW_GLM_KDA_LT_ORDER = "1", PLOW_GLM_KDA_PROJ_GROUP = "1", PLOW_GLM_KDA_QKVG_R1 = "1", PLOW_GLM_MOE_AITER = "1", PLOW_GLM_MOE_RESIDENT = "1", PLOW_GLM_MOE_SHARED_FOLD = "1", PLOW_GLM_PF_NS = "2", PLOW_GLM_ROUTER_OVERLAP = "2", PLOW_GLM_ROUTER_RAW = "1", PLOW_GLM_SEQ_PAR = "1", PLOW_GLM_SEQ_PAR_PROJ = "0", PLOW_KDA_DECODE_FUSED_ARM = "1", PLOW_KDA_FB_FOLD = "1", PLOW_KDA_PF_GROUP_GEMM = "1", PLOW_MLA_PF_V2 = "1", PLOW_MLA_PREFILL = "full:128,512,2048,8192", PLOW_MOE_DEC_W8A8 = "1", PLOW_MOE_FP8_PF_LEAN = "1", PLOW_MOE_FP8_PF_PACKED = "1", PLOW_MOE_PF_W8A8 = "1", PLOW_UNISEG = "0", PLOW_XR_DEC_CUS = "64" }
args = [
  "--emit", "devblob",
  "--arch", "gfx950",
  "--gpu", "MI350X",
  "--num-gpus", "8",
  "--parallel", "tp",
  "--max-ctx", "65536",
  "--n-cu", "256",
]

# Per-slot prefix cache snapshot route; persistent TP rank host pool; prefill admission hold.
[serve]
env = { PLOW_STATE_CLEAR_DEVICE = "1", PLOW_TP_AGREE_EVERY = "1", PLOW_DECODE_MIN_RUNG = "1", PLOW_PF_INTERLEAVE = "8192", PLOW_PF_BACK_TO_BACK = "1", PLOW_PREFIX_ARM_END = "1", PLOW_MLA_PF_DENSE = "1", PLOW_XR_TAG_SLOT = "90112", PLOW_AMD_PACKED_SEG_MAJOR = "1", PLOW_AMD_SNAP_KERNEL = "1", PLOW_AMD_PACKED_LEAN_KDA_BATCH = "1", PLOW_KDA_CARRY_SPLIT = "4", PLOW_PF_HOLD = "8192,50,16", PLOW_AMD_KARG_CHAIN_FLUSH = "1", PLOW_TP_RANK_POOL = "1", PLOW_TP_PAR_HOST = "1", PLOW_ROWBAND = "1", PLOW_AMD_XR_NATIVE = "4096", PLOW_AMD_ROUTER_NATIVE = "1", PLOW_AMD_ROUTER_FUSED = "1", PLOW_AMD_DENSE_NATIVE = "1", PLOW_AMD_MOE_DEC_TILES = "1", PLOW_AMD_LT_FUSE = "1", PLOW_AMD_LT_CONCURRENT = "1", PLOW_TP_AUDIT_TAIL = "1", PLOW_AMD_TAIL_SIGNAL = "1", PLOW_PACKED_PREFILL_ROUTE = "0" }

[capabilities]
live_kv = "AMD gfx950 uses flat KV allocation with HSA shared prefix"
packed_prefill = "AMD gfx950 uses HSA span-sampling runtime packed prefill"
segment_roles = "AMD gfx950 uses native ELF/CO objects and hipBLASLt runtime dispatch"
token_batch = "AMD gfx950 uses advance_packed_mixed for decode riding"
generated_kernels = "CUDA cubin only; AMD uses native gfx950 ELFs"
device_sampler = "CUDA cubin only; AMD uses host/K3 sampling"
cublaslt_prefill = "CUDA only; AMD uses native gfx950 GEMM/MoE kernels"

[[gates]]
name = "smoke"
cmd = "scripts/serve_test/smoke.sh"

[[gates]]
name = "llm_fp32_ref"
cmd = "scripts/llm/fp32_ref_gate.py"
expect = "PASS"

[[gates]]
name = "needle-long-context"
cmd = "scripts/glm53_needle_probe.py"
expect = "36/36"

[measured]
tok_s = 104.03
p50_tpot_ms = 8.62
p50_ttft_ms = 130.65
concurrency = 1
input_len = 4096
output_len = 128
client = "vllm 0.31.1rc1 bench serve (scripts/bench/llm_grid.sh)"

