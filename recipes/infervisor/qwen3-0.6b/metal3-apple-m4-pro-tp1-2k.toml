# Qwen3-0.6B on Apple Silicon (M4 Pro, 16 GPU cores): the laptop-node bundle. Metal shaders are
# compiled on the serving machine from the packet, so the bundle carries no objset; the tokenizer
# is the plow-generated `tokenizer.json`. Built by hand with `plowc --gpu m4pro` at plow_git and
# first published to the beta registry on 2026-10-13; this recipe records that build.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "qwen3-0.6b"
label = "metal3-apple-m4-pro-tp1-2k"
plow_git = "9f1ca46899b2f0297a022beb1046ba53f2976734"
network = "qwen3-0.6b"

[target]
vendor = "apple"
isa = "metal3"
sku = "Apple M4 Pro"
units = 16
mem_bytes = 19069665280
num_gpus = 1
parallel = "tp"
max_ctx = 2048

[checkpoint]
source = "hf:Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"

[cell]
max_ctx = 2048
