# Gemma 4 E4B on L40S (sm_89, 142 SMs, 48 GB), BF16. The non-Hopper warp32 interpreter: no TMA
# GEMM, FA v3 or wgmma segment objects; decode up to 32 rows, batched GEMVs on the tensor cores.
#
#   nix develop --command python3 scripts/campaign/campaign.py build \
#     recipes/infervisor/gemma-4-e4b/sm89-l40s-tp1.toml --out <fresh dir>
#
# Gate: logit parity vs HF bf16 top1 0.9867, KL mean 7.75e-4. Decode ctx 1024 B=1/16/32
# 13.61/15.26/16.55 ms = 82/82/84% of the roofline (docs/runtime/l40s-recipes.md).

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-e4b"
label = "sm89-l40s-tp1"
plow_git = "abb00b818378f4c09a2b53192d49cf192bc69f62"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_89"
sku = "L40S"
units = 142
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:google/gemma-4-E4B-it"
revision = "ee0ef6023621cff504d758262d4e04895a5af4a2"

[cell]
name = "gemma-4-e4b-l40s"
hf_dir = "{hf:google/gemma-4-E4B-it@ee0ef6023621cff504d758262d4e04895a5af4a2}"
gpu = "l40s"
arch = "sm_89"
n_cu = 142
n_gpu = 1
max_ctx = 4096

[emit]
emit = "devblob+cubin"
args = ["--served-name", "gemma-4-e4b"]
[emit.env]
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
PLOW_MAX_CHUNK = "512"
# Decode ladder to the 128-row clamp: slots are the widest rung and `auto` picks the rung per
# tick. Rungs past 32 take ceil(B/32) mma walks, so their projections (and lm_head) run on
# cuBLASLt from 32 rows, reading the weights once: B=32/64/128 ctx 1024 16.55/25.06/42.82 -> 15.66/18.60/24.83 ms.
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64,128"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "32"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
# Prefill projections on cuBLASLt (segment_roles sm89 E4B shapes) with gate/up unfused so they reach
# the library too (the fused GemmGlu stayed on the interpreter GEMM at 8% of the roofline): cold TTFT
# 324/1376/3944 tokens 140/418/1121 -> 41.5/124/341 ms (11.6k tok/s); decode steps unchanged.
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"

[bench]
kind = "chat"

[gates]
python = "{env:PYREF}"
[gates.llm_logit_parity]
hf_dir = "{hf:google/gemma-4-E4B-it@ee0ef6023621cff504d758262d4e04895a5af4a2}"
top1_min = 0.98
kl_mean_max = 2e-3

# VMM-backed KV prefix cache on every request path (sessions, shared system prompts, replays).
[serve.env]
PLOW_VMM_PREFIX = "1"
