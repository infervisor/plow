# Nemotron-3.5-ASR-streaming-0.6B on L40S (sm_89, 142 SMs, 48 GB): the L4 recipe's
# `rnnt.greedy.v1` packet pipeline from the Q8_0 GGUF (offline encoder buckets + cache-aware stream
# programs) compiled for 142 SMs, FP32 speech ops on the sm_89 speech object. Not a plowc emit;
# [build].script is the reproducible build.
#
#   nix develop --command scripts/asr/nvidia/nemotron_l4_build.sh <q8_0.gguf> <fresh dir> 142
#
# Gate: WER on the 73-clip LibriSpeech dummy set = 5.13%; c1 p50 60 ms, RTFx 103.5; c4 RTFx 123
# (docs/runtime/l40s-recipes.md).

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "nemotron-3.5-asr"
label = "sm89-l40s-tp1"
plow_git = "abb00b818378f4c09a2b53192d49cf192bc69f62"
network = "fastconformer-rnnt"
doc = "docs/runtime/asr.md"

[target]
vendor = "nvidia"
isa = "sm_89"
sku = "L40S"
units = 142
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:nvidia/nemotron-3.5-asr-streaming-0.6b"
file = "nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"

[build]
script = "scripts/asr/nvidia/nemotron_l4_build.sh"
compiler = "crates/plowrt/examples/asr/nemotron_pipeline_compile.rs"
feature_frames = "200,400,600,800,1000,1200,1400,1600,1800,2000,2200,2400,2600,2800,3000"
joint_batch = 16
n_cu = 142
stream_rows = 4
[build.objects]
interp_sm89_speech = "-DPLOW_SPEECH_OPS=0x20000ffffull"

[serve]
# plowrt serve --asr-packet <served name>=<dir>/nemotron.pkt,tokenizer=<dir>/tokenizer.q8_0.gguf,backend=cuda
served_name = "nemotron-3.5-asr"
backend = "cuda"

[gates.asr_wer]
manifest = "{env:ASR_MANIFEST}"
conc = "1"
wer_max = 0.055
