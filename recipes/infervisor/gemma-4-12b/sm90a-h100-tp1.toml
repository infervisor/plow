# Gemma-4-12B-it FP8 (hub checkpoint, re-keyed) on H100 SXM5: FP8 W8A8 weights, FP8 per-token-head
# KV, 16K context, 128 decode slots, prefix cache on. Production recipe for this model/GPU/precision.
#
# Checkpoint: hub HYPR4AI/Gemma-4-12B-it-FP8 @ eff0443cd167de86c7cf6ff6d2eb11d0cac3ad69 (model.safetensors
# sha256 42af19bbd16c1b6a9996b01b13c558a79a3e4198f2fad3b1fafab7fb4c8bc3e9), re-keyed to plow's fp8/ contract
# without requantizing (scripts/gemma4_fp8_hub_rekey.py); GEMMA12B_CHECKPOINT = the re-keyed dir.
#
#   PLOW_CAMPAIGN_NO_NIX=1 (box without nix only) \
#   python3 scripts/campaign/campaign.py build recipes/infervisor/gemma-4-12b/sm90a-h100-tp1.toml --out <fresh dir>
#
# Qualified: campaign.py report MATCHED + EQUIVALENT vs vLLM 0.28 fp8_per_token_head KV;
# FP32-reference gate PASS. Summary: perf-data/campaign/gemma12b-fp8-20260930/comparison.md.
#
# Routes (per-rung evidence: docs/runtime/kernel-generators.md):
#   prefill: cuBLASLt FP8 OUTER_VEC / native FP8 GEMM; generated hd256 sliding / hd512 global attn.
#   decode:  cuBLASLt output head, light FP8 attention (16B loads, direct V conversion, segmented FlashDecode).
schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-12b"
label = "sm90a-h100-tp1"
status = "validated"
plow_git = "b224f22feeed735bbd3b367a6f14591fdb191d8c"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 16384
toolchain = "cuda-12.9-nix"

[checkpoint]
source = "hf:HYPR4AI/Gemma-4-12B-it-FP8"
revision = "eff0443cd167de86c7cf6ff6d2eb11d0cac3ad69"
sha256 = { "model.safetensors" = "42af19bbd16c1b6a9996b01b13c558a79a3e4198f2fad3b1fafab7fb4c8bc3e9" }
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-12b.h100.fp8kv-16k-c128"
model = "HYPR4AI/Gemma-4-12B-it-FP8 (compressed-tensors, re-keyed)"
revision = "eff0443cd167de86c7cf6ff6d2eb11d0cac3ad69"
hf_dir = "{env:GEMMA12B_CHECKPOINT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "w8a8"

[emit]
args = ["--segmented", "--served-name", "gemma-4-12b-it-fp8"]
[emit.env]
PLOW_GLU_QUANT_FUSE = "1"
# Decode: light FP8 attn, 16B loads, direct V conv, segmented hd256 FlashDecode.
# Prefill: ROPE_PF gives packed-prefill FP8-KV segment object light rope; QNORM_FUSE folds quant into norm.
NVCC_APPEND_FLAGS = "-DPLOW_NV_GLU_QUANT_CACHE=1 -DPLOW_NV_GLU_QUANT_WPR=1 -DPLOW_NV_LIGHT_FP8_ATTN=1 -DPLOW_FP8_LD16=1 -DPLOW_FP8_FAST=1 -DPLOW_NV_FA_RG8=2 -DPLOW_NV_FA_RG8S=1 -DPLOW_NV_RAW_NARROW=1 -DPLOW_NV_INST_PRELOAD=1 -DPLOW_NV_FA_TC16=1 -DPLOW_NV_ROPE_PF=1"
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_FP8_KV = "1"
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"
PLOW_SEG_FA256_GQA2 = "1"
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
# Full-layer decode group = GQA group of 16 (TC16); nsplit 132 / B.
PLOW_ATTENTION_DECODE_BALANCE_GF = "16"
PLOW_NS_FULL_ABS = "132"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,128"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "128"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"
PLOW_QNORM_FUSE = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = ["gen_sm90a_attn_pf_hd256_sliding_fp8kv.cubin", "gen_sm90a_attn_pf_hd512_fp8kv.cubin", "plow_fa4_hd512.aot"]
[objects.env]
PLOW_BUILD_FATLITE = "1"
NVCC_APPEND_FLAGS = "-DPLOW_NV_GLU_QUANT_CACHE=1 -DPLOW_NV_GLU_QUANT_WPR=1"
PLOW_BUILD_W8A8 = "1"
PLOW_BUILD_FP8KV_GEMM = "1"
PLOW_BUILD_FA_GQA2_PAIR = "0"
PLOW_BUILD_PFATTN_HD256_BKV32 = "0"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "0"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "0"
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"
# Global (hd512) prefill attention through FlashAttention-4 SM90 forward AOT over fp16
# (objects/plow_fa4_hd512.aot; docs/arch/28).
PLOW_BUILD_FA4_HD512 = "f16"

[emit_roles.env]
# The packet declares the library route on every prefill rung (lib-attn2; plowrt runs only what
# the packet declares).
PLOW_EMIT_ATTN_LIBRARY = "1"
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "0"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"

[serve.env]
PLOW_PREFIX_CACHE = "1"
PLOW_VMM_PREFIX = "1"
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
PLOW_PF_INTERLEAVE = "2048"
PLOW_VMM_LIVE_RINGS = "1"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "128"
PLOW_PF_NORM_ROW_BLOCKS = "1152"
# Cap host KV cache to 64GB to prevent host memory exhaustion during long runs.
PLOW_HOST_KVCACHE_SIZE = "64GB"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:GEMMA12B_CHECKPOINT}"
model_id = "gemma-4-12b-it-fp8"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[bench.profiles.realtime]
in_lens = "128 1024 4096 7000 15000"
concs = "1 4"
nprompt = 32
serve_env = { PLOW_DECODE_MAX_RUNG = "4" }

[bench.profiles.high_concurrency]
in_lens = "128 1024 4096 7000 15000"
concs = "16 32 64 128"
nprompt = 384
serve_env = { PLOW_DECODE_MAX_RUNG = "128" }

# FP32-reference gate: GEMMA12B_FP32_REF = cached FP32 ref.json, GEMMA12B_FP32_VLLM = vLLM 0.28 capture.
[rung_choices.PLOW_EMIT_ATTN_LIBRARY]
label = "qualified"
evidence = ["perf-data/campaign/gemma12b-fp8-20260930/comparison.md", "docs/arch/28-library-attention.md"]

[measured]
tok_s = 622.7
p50_tpot_ms = 97.3
concurrency = 128
input_len = 4096
output_len = 128
client = "vllm 0.28.0 bench serve (campaign.py report st4k-fp8, 2 repeats 622.9 / 622.4, packet 5fbe627c02af)"

[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:GEMMA12B_FP32_REF}"
vllm_capture = "{env:GEMMA12B_FP32_VLLM}"
# Relaxed margin per docs/bringup/agent-tools.md: peer minus 2 cases (40 of 46) for 7-23% faster prefill.
cont_decisive_drop_max = 0.044

[reference]
csv = "perf-data/campaign/gemma4-12b.h100.reference-vllm028-fp8.csv"
