# Gemma-4-12B-it BF16 on Intel Xeon 6975P-C (Granite Rapids, 96 cores, SNC3, AMX-BF16): BF16 weights, BF16
# KV, 2K context, 64 decode slots, greedy. Production recipe for this model/CPU/precision.
#
#   nix develop -c cargo build --release -p plowc
#   nix develop -c cargo build --release -p plowrt --no-default-features --features cpu
#   GEMMA4_12B_CHECKPOINT=<hf dir> python3 scripts/campaign/campaign.py build \
#       recipes/infervisor/gemma-4-12b/xeon6-amx-bf16.toml --out <fresh dir>
#
# CPU target (docs/runtime/cpu.md): `plowc --gpu xeon6975p --arch amx`; the CPU engine runs the packet on
# its AMX/AVX-512 tiers, `n_cu` = 96 virtual executors (one per physical core). Host state for every
# measurement (all arms): kernel.numa_balancing=0, a zero-latency CPU QoS request held
# (/dev/cpu_dma_latency, as tuned latency-performance does), THP madvise, no pseudo-lock held (PLOW_CPU_SRAM off).
#
# Qualified (2026-10-07, plowrt b6924229, packet 9481a0630569):
# campaign.py report MATCHED + EQUIVALENT vs vLLM 0.30 CPU at 1000/128 c1/c8/c32; FP32-reference gate PASS,
# KL mean 0.011 vs vLLM 0.021. Throughput 2.04-3.41x, TTFT P99 0.67-0.82x, TPOT P99 0.28-0.50x, memory 0.53-0.63x (wins every row).
# docs/bringup/results/gemma4-xeon6-bf16-20261006/comparison.md.
schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-12b"
label = "xeon6-amx-bf16"
status = "validated"
network = "gemma4"

[target]
vendor = "intel"
isa = "amx"
sku = "Xeon 6975P-C"
units = 96
num_gpus = 1
parallel = "none"
max_ctx = 2048
toolchain = "nix"

[checkpoint]
source = "google/gemma-4-12B-it"
layout = "hf-bf16"

[cell]
name = "gemma-4-12b.xeon6.bf16-2k-c32"
model = "gemma-4-12B-it (BF16 safetensors)"
revision = "local"
hf_dir = "{env:GEMMA4_12B_CHECKPOINT}"
gpu = "xeon6975p"
arch = "amx"
n_cu = 96
max_ctx = 2048
precision = "bf16"

[emit]
emit = "devblob"
args = []
[emit.env]
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64"
PLOW_MAX_CHUNK = "2048"
PLOW_DENSE_PF_NS_MIN = "2"

[serve.env]
PLOW_CPU_WEIGHT_AFFINE = "1"

[bench]
backend = "openai"
in_lens = "1000"
concs = "1 8 32"
nprompt = 96
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:GEMMA4_12B_CHECKPOINT}"
model_id = "checkpoint"

# FP32-reference gate (scripts/llm/fp32_ref_gate.py, 2K prompt set, --device cpu reference):
# GEMMA4_12B_FP32_REF = ref.json, GEMMA4_12B_FP32_VLLM = the vLLM 0.30 capture against it.
[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:GEMMA4_12B_FP32_REF}"
vllm_capture = "{env:GEMMA4_12B_FP32_VLLM}"
concurrency = 8
