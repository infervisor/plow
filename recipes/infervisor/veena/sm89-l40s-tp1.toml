# Veena (maya-research/Veena) on L40S (sm_89, 142 SMs, 48 GB), BF16: the H100 recipe's codec-LM
# contract minus the Hopper-only decode knobs (decode cuBLASLt, FA fold, dense tune) and the wgmma
# `_gw` rungs past 32. Prefill projections go through cuBLASLt (Llama-TTS shapes); the SNAC
# decoder runs as codec.pkt on the sm_89 speech object.
#
#   PYREF=<python with torch + snac> nix develop --command python3 scripts/campaign/campaign.py \
#     build recipes/infervisor/veena/sm89-l40s-tp1.toml --out <fresh dir>
#
# Gate: Whisper CER median 0.005-0.016 (n=80, sampled). Decode as Orpheus (same Llama-3.2-3B
# shapes): 89/90/91% of the roofline at B=1/16/32; streaming c1 TTFA 141 ms, RTF 0.75.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "veena"
label = "sm89-l40s-tp1"
plow_git = "abb00b818378f4c09a2b53192d49cf192bc69f62"
network = "llama"

[target]
vendor = "nvidia"
isa = "sm_89"
sku = "L40S"
units = 142
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:maya-research/Veena"
revision = "8b770f9e69e6b35ef320d4cd70a99a4ab6dd022f"
codec = "hf:hubertsiuzdak/snac_24khz"
codec_revision = "d73ad176a12188fcf4f360ba3bf2c2fbbe8f58ec"

[cell]
name = "veena-l40s"
hf_dir = "{hf:maya-research/Veena@8b770f9e69e6b35ef320d4cd70a99a4ab6dd022f}"
gpu = "l40s"
arch = "sm_89"
n_cu = 142
n_gpu = 1
max_ctx = 2048

# SNAC decoder export (folded weight norm, torch layouts) read by the codec lowering.
[[prep]]
name = "snac-export"
script = "scripts/tts/snac_export.py"
args = ["{out}/prep/snac"]

[emit]
emit = "devblob+cubin"
args = ["--served-name", "veena"]
[emit.env]
PLOW_TTS_PROFILE = "veena"
PLOW_TTS_CODEC_DIR = "{out}/prep/snac"
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "64,256"
# 32 streams: 7 GiB of KV.
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"
# hd128 row-group flash decode with merge fold (no FlashMerge level; changes attention sum
# order): 0.6B / 1.7B / Orpheus B=16 ctx 1024 4.57/7.57/11.81 -> 4.40/7.30/11.37 ms.
PLOW_NV_FA_FOLD = "1"

[bench]
kind = "speech"
client = "scripts/tts/tts_bench.py"

[gates]
python = "{env:PYREF}"
[gates.tts_cer]
arms = ["--conc 1 --stream --wav --n 16", "--conc 32 --stream --wav --n 64"]
cer_median_max = 0.05
