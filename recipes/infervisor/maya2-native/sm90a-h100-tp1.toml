# Maya 2 Native (maya-research/maya2-native) on H100 (sm_90a, 132 SMs, 80 GB): Qwen3-1.7B backbone
# (BF16, restricted cb0 head of 2049 rows), DepthV2 as the packet's depth stage (fp16 weights,
# tensor-core projections on mma.m16n8k16 with fp32 residuals, host cb0 controller), Mimi decoder
# codec.pkt (fp32, 24 kHz). High concurrency decode ladder 1..128 at 2048 ctx. Apache-2.0.
#
#   PYREF=<python with torch + safetensors> nix develop --command \
#     python3 scripts/campaign/campaign.py build recipes/infervisor/maya2-native/sm90a-h100-tp1.toml --out <fresh dir>
#
# Gates: Whisper CER of served speech.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "maya2-native"
label = "sm90a-h100-tp1"
plow_git = "81b75a754edbb1691218521bc1e3e7f9ebcf3bdf"
network = "qwen3"
doc = "docs/runtime/tts.md"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:maya-research/maya2-native"
revision = "7cce38065147840d68011e18d25f4d68462e402f"

[cell]
name = "maya2-native-h100"
hf_dir = "{out}/prep/lm"
gpu = "h100"
arch = "sm_90a"
n_cu = 132
n_gpu = 1
max_ctx = 2048

[[prep]]
name = "lm-checkpoint"
script = "scripts/tts/maya2_prep.py"
python = "{env:PYREF}"
args = ["{out}/prep/lm", "7cce38065147840d68011e18d25f4d68462e402f"]

[[prep]]
name = "codec-export"
script = "scripts/tts/mimi_decoder_export.py"
python = "{env:PYREF}"
args = ["{out}/prep/codec", "kyutai/mimi", "89091b3e466eb6a9d11e537bf26b144f194978f7"]

# Voice cloning (`icl`): the reference clip's 32 Mimi codes per frame.
[[prep]]
name = "ref-encoder-export"
script = "scripts/tts/mimi_encoder_export.py"
python = "{env:PYREF}"
args = ["{out}/prep/codec/encoder", "89091b3e466eb6a9d11e537bf26b144f194978f7", "kyutai/mimi"]

# Cloned speakers (`spk` / `icl_spk`): speechbrain ECAPA-TDNN, run on the host (crates/plowrt/src/tts/ecapa.rs).
[[prep]]
name = "ecapa-export"
script = "scripts/tts/ecapa_export.py"
python = "{env:PYREF}"
args = ["{out}/prep/lm/ecapa"]

[emit]
emit = "devblob+cubin"
args = ["--served-name", "maya2-native"]
[emit.env]
PLOW_TTS_PROFILE = "maya2"
PLOW_TTS_CODEC_DIR = "{out}/prep/codec"
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "64,256"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,48,64,96,128,160,192,224,256"
PLOW_EMIT_FISH_CODEC_MAX_ROWS = "4352"
PLOW_NO_GLU_FUSE = "1"
PLOW_FUSE_KV_HNR = "1"
PLOW_EMIT_PACKED_PREFILL_SMALL_HD = "1"
PLOW_NV_DENSE_TUNE = "1"
PLOW_NV_FA_FOLD = "1"

[capabilities]
masked_padding = "structural: request chunk limits (masked padding) are Gemma 4 only (crates/devgen/src/lib.rs:9382), and the packed contract needs the plow_pf_masked_padding_abi object capability (crates/plow-asset/src/packed_prefill.rs:87), which only the hd256/hd512 attention and Gemma 4 GLU objects declare; Maya2 is hd128 GQA2 on interp_sm90a*. Unmasked pad rows fit: prompts < 512 rows, max_ctx 2048"
segment_roles = "OFF pending promotion; the route wins. Both cuBLASLt routes declare segment roles: prefill Lt 3.0-3.3x (cublaslt_prefill), decode Lt (PLOW_EMIT_DECODE_CUBLASLT=1) step ms at ctx 512 vs interpreter B1 2.15/2.21, B8 2.42/2.13 (loses), B32 2.85/3.11, B64 3.56/5.52, B128 5.01/7.72; logits rel-L2 0.019-0.027, top1 1.0, KL <= 0.0045. The cb0 2049 head is not an obstacle: the lm_head is routed only with PLOW_EMIT_DECODE_CUBLASLT_HEAD (crates/devgen/src/dense_cublaslt.rs:623). Decode Lt stops at 128 rows (crates/plow-asset/src/segment_roles.rs:262, crates/devgen/src/dense_cublaslt.rs:628), so rungs 160-256 need the ladder capped at 128. H100 gpu03, same step_bench, ABBA: /opt/dlami/nvme/lava-tts/maya2-caps/run1, run3"
generated_kernels = "structural: no generated role for hd128 GQA2 attention (16 q / 8 kv heads); the sm_90a catalog tuning/nvidia/sm_90a/h100-sxm5/gen_kernels.json has hd256/hd512 entries only, matched on head width (crates/devgen/src/gen_kernels.rs:406,414)"
cublaslt_prefill = "OFF pending promotion; the route wins. PLOW_EMIT_PREFILL_CUBLASLT=1 (784 projection segments) packed prefill ms vs interpreter GEMM: 64 rows 3.91/12.78, 128 4.15/13.57, 256 4.66/14.38, 512 5.91/17.57, 8x64 5.34/16.99, 4x128 5.35/17.46 (20-27% vs 6-9% of the 0.84 ms weight / 989 TFLOP/s floor). Decode programs are op-identical, and greedy decode streams after a packed prefill are identical (fnv 22622861cb922c55 at 8x64). H100 gpu03, same step_bench, ABBA: /opt/dlami/nvme/lava-tts/maya2-caps/run2, run3"

[bench]
kind = "speech"
client = "scripts/tts/tts_bench.py"
arms = ["--conc 1 --stream --wav --n 16 --prompt-set chatterbox", "--conc 1 --n 16 --prompt-set chatterbox --tag full_c1", "--conc 8 --stream --n 32 --prompt-set chatterbox", "--conc 32 --stream --n 64 --prompt-set chatterbox", "--conc 64 --stream --n 128 --prompt-set chatterbox"]

[gates]
python = "{env:PYREF}"
[gates.tts_cer]
arms = ["--conc 1 --stream --wav --n 16 --prompt-set chatterbox", "--conc 8 --stream --wav --n 32 --prompt-set chatterbox"]
cer_median_max = 0.05

[serve]
extra_args = "--decode-pipeline"
env = { PLOW_VMM_LIVE = "1", PLOW_VMM_PREFIX = "1", PLOW_LT_RUNG_ALGOS = "true", PLOW_DECODE_PIPELINE = "1", PLOW_MAX_HOLD_MS = "0", PLOW_TTS_REALTIME = "0", PLOW_PF_SEG_GRAPH = "0", PLOW_PF_INTERLEAVE = "0" }
