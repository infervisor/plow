name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The nix build runs on self-hosted hardware, so it must never be triggered by
  # a pull request from a fork: that would execute untrusted code on our runner.
  # Fork PRs are covered by the hosted job below and merged only after review.
  nix-build:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    defaults:
      run:
        shell: nix develop .#ci --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject stale perf tool paths
        run: |
          old_path='perf-data/'"harness/"
          ! git grep -n --fixed-strings "$old_path" -- .
      - name: Reject new amd-bench performance consumers
        run: scripts/check_amd_bench_consumers.sh
      - name: Check fusion-ladder result validator
        run: |
          python3 perf-data/tools/fusion_ladder_results.py --self-test
          python3 perf-data/tools/fusion_ladder_run.py --self-test
      - name: Check bench/serve parity validator
        run: python3 perf-data/tools/check_bench_serve_parity.py --self-test
      - name: Check recipe tools
        run: |
          python3 scripts/check_recipe.py --self-test
          python3 scripts/render_recipe.py --self-test
      - name: Check recipes describe their builds
        run: |
          python3 scripts/check_recipe.py recipes/*/*/*.toml
          python3 scripts/render_recipe.py recipes/*/*/*.toml --check
      - name: Enter Nix shell
        run: nix develop --command true
      # Both need the flake's ROCm toolchain (build_gfx942.sh refuses to run without it), and
      # neither compiles a kernel: PLOW_DEFINES_ONLY resolves the axes in seconds. The first
      # asserts the PLOW_HSACO_CONFIG path derives the object set from a packet and refuses a
      # disagreeing environment by name; the second asserts every checked-in recipe's
      # `[objects].env` produces the -D set `check_recipe.py` would later compare against.
      - name: Check build_gfx942.sh packet-config path
        run: nix develop --command scripts/build_gfx942_config_selftest.sh
      - name: Check recipes' object env against build_gfx942.sh
        run: nix develop --command python3 scripts/tests/test_recipe_objects_env.py
      - name: Build default package
        run: nix build
      - name: Test workspace
        run: nix develop --command cargo test --locked --workspace
      # The engine unit tests under exec/{amd,gpu} are feature-gated, so the
      # default-feature workspace run never compiles them. They are host-side
      # (device cases are #[ignore]d) and run without a GPU.
      - name: Test engine host paths (cuda,hsa)
        run: "nix develop --command cargo test --locked -p plowrt --features cuda,hsa --lib exec::"
      # Required lean-correctness lane (CPU only): build the pinned plow_verify, audit every
      # endpoint's acceptance theorems for sorry/unapproved axioms, check the binary against
      # lean-plow/approved-verifiers.json, and run the explicit list of ignored CPU-verifier tests
      # (docs/bringup/lean-correctness-inventory.md).
      - name: Lean correctness (build, proof audit, CPU verifier suites)
        run: nix develop --command scripts/lean_correctness_ci.sh
      # Checkpoint S for every knob this change touches (scripts/knob_scope_ci.sh): the production
      # recipe and its one-layer cut, compared against the knob's declared scope. Passes at once
      # when no knob is touched; otherwise it needs the runner's KNOB_SCOPE_HF_DIR,
      # KNOB_SCOPE_RECIPE and PLOW_VERIFY_BIN, and fails without them.
      - name: Knob scope (checkpoint S)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          nix develop --command bash -c 'cargo build --release -p plowc -p plowrt --features plowrt/hsa && scripts/knob_scope_ci.sh "$BASE_SHA"'
      # Checkpoint P on default flips (scripts/perf_gate_ci.sh): a change to a production default
      # or Qualified status needs a committed perf-certs/<knob>.json that plow_verify P accepts.
      - name: Perf gate (checkpoint P)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: nix develop --command scripts/perf_gate_ci.sh "$BASE_SHA"

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Validate workflows
        run: nix develop .#ci --command actionlint
      - name: Format
        run: nix develop .#ci --command cargo fmt --all --check

  # Hosted, sandboxed: safe for fork PRs. No GPU toolchain or driver required.
  hosted-check:
    name: hosted-check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop .#ci --command bash -euo pipefail {0}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hosted-${{ matrix.runner }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Reject stale perf tool paths
        run: |
          old_path='perf-data/'"harness/"
          ! git grep -n --fixed-strings "$old_path" -- .
      - name: Reject new amd-bench performance consumers
        run: scripts/check_amd_bench_consumers.sh
      - name: Check fusion-ladder result validator
        run: |
          python3 perf-data/tools/fusion_ladder_results.py --self-test
          python3 perf-data/tools/fusion_ladder_run.py --self-test
      - name: Check bench/serve parity validator
        run: python3 perf-data/tools/check_bench_serve_parity.py --self-test
      - name: Check recipe tools
        run: |
          python3 scripts/check_recipe.py --self-test
          python3 scripts/render_recipe.py --self-test
      - name: Check recipes describe their builds
        run: |
          python3 scripts/check_recipe.py recipes/*/*/*.toml
          python3 scripts/render_recipe.py recipes/*/*/*.toml --check
      - name: Type-check
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: CPU runtime
        run: cargo test --locked -p plowrt --no-default-features --features cpu
      # `serve` performs no network I/O, and that is the property the whole
      # producer/consumer split rests on: the CLI fetches, in a separate
      # process, and the serving binary needs no egress. A dependency edge is
      # how it would silently stop being true, so the serve-only feature set is
      # asserted to contain no HTTP or TLS crate. `dist` is the feature that
      # legitimately adds them, and it is not in this set.
      # The store, the reference grammar, the selector and the pull pipeline all
      # run against a `file://` fixture, so this needs no network and no GPU.
      - name: Distribution
        # Quoted: a plain scalar ending in `::` is a YAML mapping indicator, and
        # GitHub then refuses the whole workflow before any job starts.
        run: "cargo test --locked -p plowrt --no-default-features --features cpu,dist --lib dist::"
      - name: serve is offline
        run: |
          tree=$(cargo tree --locked -p plowrt --no-default-features --features cuda,hsa,cpu -e normal)
          for crate in ureq rustls hyper-tls native-tls reqwest openssl; do
            if grep -qE "^[^a-z]*${crate} v" <<<"$tree"; then
              echo "FAIL: ${crate} is reachable from a serve-only plowrt build"
              exit 1
            fi
          done
          echo "serve-only build links no HTTP/TLS crate"
      # The feature set the README's quickstart tells people to build, and the
      # only step that compiles the CUDA and HSA backends at all. `cargo check
      # --workspace --all-targets` above runs on DEFAULT features (`default =
      # []`), so every `#[cfg(feature = "cuda")]` and `#[cfg(feature = "hsa")]`
      # line is invisible to it — which is how a `chat_stop_ids` call in
      # `exec/gpu.rs` sat one argument short of its own signature until someone
      # tried the documented build. Neither driver is linked (both are
      # `dlopen`ed), so this needs no CUDA or ROCm on the runner.
      - name: GPU backends type-check (README quickstart feature set)
        if: runner.os == 'Linux'
        run: cargo check --locked -p plowrt --all-targets --features cuda,hsa
      - name: Test engine host paths (cuda,hsa)
        if: runner.os == 'Linux'
        run: "cargo test --locked -p plowrt --features cuda,hsa --lib exec::"
      - name: Apple backends type-check
        if: runner.os == 'macOS'
        run: cargo check --locked -p plowrt --all-targets --features metal,ane
      - name: CPU kernel oracles
        run: |
          cmake -S runtime -B build-cpu -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpu --parallel 2
          ctest --test-dir build-cpu --output-on-failure --no-tests=error --parallel 2

  # Keep a stable required-check name across matrix changes.
  check:
    if: always()
    needs: [fmt, hosted-check, nix-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          HOSTED_RESULT: ${{ needs.hosted-check.result }}
          SELF_HOSTED_RESULT: ${{ needs.nix-build.result }}
        run: |
          test "$FMT_RESULT" = success
          test "$HOSTED_RESULT" = success
          test "$SELF_HOSTED_RESULT" = success || test "$SELF_HOSTED_RESULT" = skipped
