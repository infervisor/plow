# Experimental: isolate the measured 4.21 ms B128 head group; no performance or quality qualification.
# BF16 head uses Lt only at B128; smaller rungs retain fused GemvArgmax.
# Experimental short-context FP8 Lt decode candidate; GPU qualification pending.
# 128 BF16-KV slots at context 1024: expected 42 GiB KV plus weights/activations.
# HD512 uses the standard path: the PX4 role applies only to absent 4K/8K rungs.
# Context includes input and generated tokens; benchmarks stay within this limit.
# Decode 1..64 retains W8A16 GEMV; 128 uses per-row activation quant + per-channel FP8 Lt.
# Gate/up are separate Lt projections followed by GLU; norm folding into GEMV is disabled at 128.
# The pinned compiler emits PLOW_NV_FP8_LT_DECODE=1 in plow_config.h for decode quantization.
# Do not enable TC64: that object currently requires a widest decode rung of 64.
# Build with campaign.py build --no-probe; run the doctor, then queue all GPU validation.
# Control: override PLOW_EMIT_DECODE_CUBLASLT_HEAD=0; body projections remain identical.
# Re-key the hub weights without requantization and set GEMMA12B_CHECKPOINT.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-12b"
label = "sm90a-h100-tp1-fp8-1k-c128-lt-head"
status = "emits"
plow_git = "ef47eab3dd2ff98893d2a2656a17e5463d1f4d3b"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 1024
toolchain = "cuda-12.9-nix"

[checkpoint]
source = "gemma-4-12b-it-fp8"
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-12b.h100.fp8-1k-c128-lt-head"
model = "gemma-4-12b-it-fp8 (compressed-tensors, re-keyed)"
revision = "local"
hf_dir = "{env:GEMMA12B_CHECKPOINT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 1024
precision = "w8a8"

[emit]
args = ["--segmented"]
[emit.env]
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_EMIT_PACKED_PREFILL = "1"     # default-on only for BF16 Hopper; the roles need the metadata
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"               # [FP8-TAX] GEMMA4_SEG_FA512_DEFAULT is bf16-gated
PLOW_SEG_FA256_GQA2 = "1"          # [FP8-TAX] GEMMA4_SEG_FA256_GQA2_DEFAULT is bf16-gated
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "1024"
PLOW_MAX_REQUEST_CHUNK = "1024"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_NS_FULL_ABS = "66"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64,128"
PLOW_FP8_DECODE_TC64 = "0"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "128"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256"
PLOW_FUSE_ARGMAX = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = []
[objects.env]
PLOW_BUILD_W8A8 = "1"
PLOW_BUILD_FA_GQA2_PAIR = "1"
PLOW_BUILD_PFATTN_HD256_BKV32 = "1"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "1"

[emit_roles.env]
# These specialized roles require 4K/8K rungs; the 1K packet uses standard objects.
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "0"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "0"

[serve.env]
PLOW_PREFIX_CACHE = "0"
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
PLOW_PF_INTERLEAVE = "0"
PLOW_VMM_LIVE_RINGS = "0"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "128"
PLOW_TOKEN_BATCH = "1"
PLOW_QUEUE_TTL_MS = "0"
PLOW_RUNG_FAST_PROBE = "1"

[bench]
backend = "openai"
in_lens = "128 512 768"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:GEMMA12B_CHECKPOINT}"
model_id = "checkpoint"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[bench.profiles.realtime]
in_lens = "128 512 768"
concs = "1 4"
nprompt = 32
serve_env = { PLOW_DECODE_MAX_RUNG = "4" }

[bench.profiles.high_concurrency]
in_lens = "128 512 768"
concs = "16 32 64 128"
nprompt = 384
serve_env = { PLOW_DECODE_MAX_RUNG = "128" }

[reference]
csv = "perf-data/campaign/gemma4-12b.h100.reference-vllm028-fp8.csv"
