# Gemma-4-26B-A4B-it, H100 SXM5, BF16, TP1 — 32 slots at a 16k context WITHOUT dropping the chunk.
# ctx16k (chunk 4096, roles on) plus PLOW_MAX_REQUEST_CHUNK=1024: one request contributes at most
# 1024 rows to a launch, so a slot's sliding ring is next_pow2(1024 + 1024 - 1) = 2048 rows (0.59 GiB)
# instead of 8192 (1.76 GiB / 103 GiB at 32 slots) and 32 slots fit with the attention roles on.
# A 4096-row launch packs four requests' 1024-row slices; a single request runs 1024 rows per launch.
# Compare: gemma4-26b-a4b.h100.bf16-c32-16k.toml (chunk 1024, roles off) and the ctx16k recipe.
# Measured (e2e3, p26rq4): C32 TTFT 172/368/1284/2603/5145 ms, 1858/1295/694/410/232 tok/s at
# 128/1024/4096/8192/15000 in, 128 out.
# Production (C32 traffic, --profile high_concurrency): build and serve as in the 12B ladder16k header.

[cell]
name = "gemma4-26b-a4b.h100.bf16-c32-req1k-16k"
model = "google/gemma-4-26b-a4b-it"
revision = "local"
hf_dir = "/opt/dlami/nvme/hf-cache/hub/gemma-4-26b-a4b-it"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
# TWO constraints pin this, and 8192 satisfies neither for the 8K rung:
#
#  1. The 8K rung needs 8192 input + 128 output = 8320 live positions. A packet compiled
#     at exactly 8192 rejects every 8192-token request ("context length exceeded:
#     prompt + max_tokens = 8320 exceeds the compiled context 8192") and the top rung of
#     the ladder silently produces no cell.
#  2. max_ctx must be a MULTIPLE OF 2048. The full-attention KV head window is
#     max_ctx * global_head_dim(512) * 2 B, and the VMM pool requires it to be a
#     multiple of the 2 MiB allocation granularity. 8704 loads and then dies with
#     "vmm: head window 8912896 B not a multiple of granularity 2097152"
#     (8704*512*2 = 4.25 granules). 8192 happens to work (exactly 4).
#
# 10240 is the smallest value satisfying both (5 granules). The 12B recipe's 16384 is 8.
max_ctx = 16384
precision = "bf16"

[emit]
args = ["--segmented"]
[emit.env]
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
# Rungs of >= 8 rows sort their B*k slots by expert and run the routed experts through the
# grouped tensor-core GEMMs (step_bench ms/step at B=8/16: 16.3 -> 14.3, 27.0 -> 18.0).
PLOW_GEMMA_MOE_DEC_GROUP = "8"
# FINE-GRAINED RUNGS. The server re-tokenises and prepends BOS, so an N-token bench prompt is
# N+1 rows and crosses its rung: measured 25 -> 42 ms at 128|129 rows, 62 -> 91 at 1024|1025,
# 177 -> 202 at 4096|4097, 368 -> 394 at 8192|8193 (one more token, +17..29 ms: either the next
# bucket's padding or a second full-model launch for a 1-row tail). Each appended rung is the
# shipped rung + 128, which swallows that tail in one launch; the runtime's chunk-cost model
# picks it on its own. 4224 exceeds MAX_CHUNK but fits the sliding ring that MAX_CHUNK=4096
# already sizes (next_pow2(1024 + 4096 - 1) = 8192 rows >= 1024 + 4224 - 1), which is the
# condition the emitter admits an appended rung on; per-slot KV is unchanged.
# 4224 is dropped here: a rung past MAX_CHUNK needs the ring to hold it, and the ring is 2048.
PLOW_PF_LADDER_APPEND = "256,1152"
PLOW_MAX_CHUNK = "4096"
# Per-request rows per launch; sizes the sliding ring (see the header). Must be a prefill rung.
PLOW_MAX_REQUEST_CHUNK = "1024"
# Measured on this board (tune_decode_sweep.sh, step_bench, B=1, occ 1:132): folding the greedy
# argmax into the lm_head GEMV epilogue is SLOWER here — 6.501 ms/step vs 5.837 without it.
# (PLOW_FUSE_MERGE / PLOW_FUSE_HNR: no effect; PLOW_GEMMA_MOE_ROUTER_FUSED: 142 ms/step.)
PLOW_FUSE_ARGMAX = "0"
# The exact scorer replays the legacy scalar fmaf order on ONE lane per expert: measured
# 0.0460 ms/layer at B=1 vs 0.0085 for ScoreFast (moe_decode_gemma26b_bench.cu) — 1.1 ms of
# an 8.15 ms C1 decode step. ScoreFast is f32 end to end with a tree reduction, which is
# already tighter than the reference: vLLM's Gemma4Router feeds bf16 h2 into its GateLinear.
# The prefill router (moe90_router_gemma_pf) makes the same bf16-h2 / f32-logit choice.
PLOW_GEMMA_MOE_ROUTER_EXACT = "0"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = [
  "interp_sm90a_pfattn_hd512.cubin",
  "interp_sm90a_pfattn_hd256_gqa2_bkv32.cubin",
  "interp_sm90a_pfattn_hd256_bkv32.cubin",
]
[objects.env]
# The MoE-down lane split (PLOW_MOE_DOWN_SG=8, measured on this board) is NOT set here: this env
# only reaches the segments script, and the decode object is built from the manifest. It is a
# manifest rule now (tuning.moe_down_sg -> plow_config.h), which every object of the packet sees.

[emit_roles.env]
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "1"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"

[serve.env]
PLOW_PREFIX_CACHE = "0"
PLOW_PF_INTERLEAVE = "0"
PLOW_LIBCUDA = "/usr/lib/x86_64-linux-gnu/libcuda.so.595.91.07"
LD_LIBRARY_PATH = "/usr/local/cuda/lib64"

[bench]
backend = "openai"
in_lens = "128 1024 4096 8192 15000"
concs = "1 4"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "/opt/dlami/nvme/hf-cache/hub/gemma-4-26b-a4b-it"
model_id = "gemma-4-26b-a4b-it"
gate_prompt = "<bos><start_of_turn>user\nWhat is the capital of France? Answer in one short sentence.<end_of_turn>\n<start_of_turn>model\n"

# The common ladder both Gemma-4 campaigns run (12B: gemma4-12b.h100.bf16-realtime.toml): random
# prompts to a 16k context (15000 in + 128 out), C1/C4 latency cells and C16/C32 serving cells.
[bench.profiles.realtime]
in_lens = "128 1024 4096 8192 15000"
concs = "1 4"
# Queue-driven prefill packing (PLOW_PF_INTERLEAVE_ADAPTIVE): four 1024-row prompts arriving together no
# longer share one 172 ms launch; the oldest runs whole and later ones join only while that is cheaper.
# Measured p26i, 16 prompts, off -> on: 1024 in TTFT 114.5 -> 94.4 ms, TPOT 10.03 -> 10.32;
# 128 / 4096 / 15000 in level (40.1 / 247.5 / 1140.8 -> 40.5 / 246.3 / 1141.7).
serve_env = { PLOW_MULTISTEP = "4", PLOW_DECODE_MAX_RUNG = "4", PLOW_PF_INTERLEAVE = "0", PLOW_PF_INTERLEAVE_ADAPTIVE = "1" }

[bench.profiles.high_concurrency]
in_lens = "128 1024 4096 8192 15000"
concs = "16 32"
nprompt = 64
# MULTISTEP 2, not 8: measured at C16 (64 prompts) 1024-token TTFT 375 -> 249 ms, p99 ITL 228 ->
# 106 ms, tok/s 464 -> 488; 4096-token cells are unchanged (the CUDA quantum is already 1 above B=8).
# MULTISTEP 0, not 2 (2026-09-21, p26i, 32 prompts at C16, 2 -> 0): 128 in TTFT 102.9 -> 90.9 ms, TPOT 15.51 ->
# 15.15, 970 -> 1005 tok/s, p99 ITL 32.9 -> 16.7; 1024 / 4096 in level within the cell noise.
serve_env = { PLOW_MULTISTEP = "0", PLOW_DECODE_MAX_RUNG = "32", PLOW_PF_INTERLEAVE = "0", PLOW_TOKEN_BATCH = "1", PLOW_QUEUE_TTL_MS = "0" }

[reference]
csv = "perf-data/campaign/gemma4-26b-a4b.h100.reference-vllm028-bf16.csv"
