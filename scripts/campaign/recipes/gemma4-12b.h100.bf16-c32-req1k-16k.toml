# Gemma-4-12B-it, H100 SXM5, BF16, TP1 — 32 slots at a 16k context WITHOUT dropping the chunk.
# ladder16k (chunk 4096, roles on) plus PLOW_MAX_REQUEST_CHUNK=1024: one request contributes at most
# 1024 rows to a launch, so a slot's sliding ring is next_pow2(1024 + 1024 - 1) = 2048 rows (640 MiB)
# instead of the 8192 rows (2.5 GiB) the chunk alone would size, and 32 slots fit (~20 GiB of rings
# beside 22 GiB of weights). A 4096-row launch packs four requests' 1024-row slices; a single request
# still runs 1024 rows per launch (8192 in = 8 launches), which is the price of the small ring.
# Compare: gemma4-12b.h100.bf16-c32-16k.toml (chunk 1024, roles off, 1024-row launches) and
# gemma4-12b.h100.bf16-ladder16k.toml (16 slots, chunk 4096).

[cell]
name = "gemma4-12b.h100.bf16-c32-req1k-16k"
model = "google/gemma-4-12B-it"
revision = "707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7"
hf_dir = "/opt/dlami/nvme/hf-cache/hub/models--google--gemma-4-12B-it/snapshots/707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "bf16"

[emit]
args = ["--segmented"]
[emit.env]
PLOW_SEG_PURE_GEMM = "1"
PLOW_SEG_FA512 = "1"
PLOW_SEG_FA256_GQA2 = "1"
PLOW_TMA_GEMM = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"
PLOW_NO_FUSE_NRN = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_SLIDING_NS_CAP = "1"
PLOW_MAX_CHUNK = "4096"
# Per-request rows per launch; sizes the sliding ring (see the header). Must be a prefill rung.
PLOW_MAX_REQUEST_CHUNK = "1024"
# 4160/4224 are dropped by the emitter here (a rung past MAX_CHUNK needs the ring to hold it).
PLOW_PF_LADDER_APPEND = "256,1088,1152"
PLOW_FUSE_ARGMAX = "1"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_FA_MMAQK = "3"
PLOW_NS_FULL_ABS = "66"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = [
  "interp_sm90a_pfattn_hd512_px4_bq64.cubin",
  "interp_sm90a_pfattn_hd512.cubin",
  "interp_sm90a_pfattn_hd256_gqa2_bkv32.cubin",
  "interp_sm90a_pfattn_hd256_bkv32.cubin",
  "interp_sm90a_pfgemm_glu_gemma4.cubin",
]
[objects.env]
PLOW_BUILD_FATLITE = "1"
PLOW_BUILD_FA_GQA2_PAIR = "1"
PLOW_BUILD_PFATTN_HD256_BKV32 = "1"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "1"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "1"
PLOW_BUILD_MASKED_PADDING = "1"
PLOW_BUILD_PFATTN_WG = "1"
PLOW_BUILD_PFATTN_KV16 = "0"
PLOW_BUILD_PFATTN_KV64 = "0"
PLOW_BUILD_PFATTN_QK_UNROLL = "4"

[emit_roles.env]
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "1"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"

[serve.env]
PLOW_PREFIX_CACHE = "0"
# Cache-on production knobs, as in ladder16k (inert while the matched ladder runs cache-off).
PLOW_AMD_PREFIX_FINE_ROWS = "2048"
PLOW_VMM_CACHE_MIB = "9216"
PLOW_KV_POOL_MIB = "2048"
PLOW_PF_ATTN_GEMM = "1"
PLOW_PF_SEG_PURE = "1"
PLOW_PF_SEG_FA512 = "1"
PLOW_PF_INTERLEAVE = "0"
PLOW_ENCODE_THREADS = "16"
PLOW_ENCODE_SPLIT_MIN = "512"
PLOW_LIBCUDA = "/usr/lib/x86_64-linux-gnu/libcuda.so.595.91.07"
LD_LIBRARY_PATH = "/usr/local/cuda/lib64"

[bench]
backend = "openai"
in_lens = "128 1024 4096 8192"
concs = "1 4 8"
nprompt = 10
outlen = 128
warmups = 2
seed = 42
tokenizer = "/opt/dlami/nvme/hf-cache/hub/models--google--gemma-4-12B-it/snapshots/707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7"
model_id = "707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7"
gate_prompt = "<bos><start_of_turn>user\nWhat is the capital of France? Answer in one short sentence.<end_of_turn>\n<start_of_turn>model\n"

# The common ladder (26B: gemma4-26b-a4b.h100.bf16-ctx16k.toml); C32 cells run on 32 slots here.
[bench.profiles.realtime]
in_lens = "128 1024 4096 8192 15000"
concs = "1 4"
nprompt = 32
serve_env = { PLOW_MULTISTEP = "4", PLOW_DECODE_MAX_RUNG = "4", PLOW_PF_INTERLEAVE = "0", PLOW_PF_INTERLEAVE_ADAPTIVE = "1" }

[bench.profiles.high_concurrency]
in_lens = "128 1024 4096 8192 15000"
concs = "16 32"
nprompt = 64
serve_env = { PLOW_MULTISTEP = "0", PLOW_DECODE_MAX_RUNG = "32", PLOW_PF_INTERLEAVE = "0", PLOW_TOKEN_BATCH = "1", PLOW_QUEUE_TTL_MS = "0" }

[reference]
csv = "perf-data/campaign/gemma4-12b.h100.reference-vllm028-bf16.csv"
