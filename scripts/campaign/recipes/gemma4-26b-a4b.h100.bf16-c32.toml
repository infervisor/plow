# Gemma-4-26B-A4B-it, H100 SXM5, BF16, TP1 — the SERVING cell (C16/C32).
#
# Why this is a separate recipe from the realtime one, and not a profile on it:
# concurrency above 16 is gated by PACKET MEMORY, not by kernels, and the knob that
# frees it (PLOW_MAX_CHUNK) also changes prefill shape — so the two cells cannot share
# a packet. Same split the 12B campaign made (gemma4-12b.h100.bf16-c32.toml).
#
# THE ARITHMETIC THIS RECIPE EXISTS FOR. Per-slot KV is dominated by the SLIDING ring,
# whose depth is next_pow2(window + chunk - 1) — set by the CHUNK, not by max_ctx:
#
#   chunk 4096 -> ring 8192 rows -> 1.76 GiB/slot -> batch 32 needs 103.2 GiB  DOES NOT FIT
#   chunk 2048 -> ring 4096 rows -> 0.98 GiB/slot -> batch 32 needs  78.2 GiB  marginal
#   chunk 1024 -> ring 2048 rows -> 0.59 GiB/slot -> batch 32 needs  65.8 GiB  fits
#
# (47.0 GiB of weights + KV, on a 79.6 GiB card.) The realtime recipe's chunk 4096 is
# why its decode ladder stops at 16 and why measured serving throughput SATURATES at
# C16: 196.7 -> 197.4 tok/s from C16 to C32 at 1024, and 83.8 -> 83.8 at 4096. The
# extra concurrency had nowhere to go. Adding a 32 rung to THAT packet would not have
# helped — it would not have fit.
#
# Expected payoff: plow's TPOT is batch-insensitive (~76 ms at both C16 and C32), so
# throughput is ~batch/TPOT and a 32-wide decode should roughly double it. To be
# MEASURED, not assumed — this campaign has had five inferred levers refuted already.

[cell]
name = "gemma4-26b-a4b.h100.bf16-c32"
model = "google/gemma-4-26b-a4b-it"
revision = "local"
hf_dir = "/opt/dlami/nvme/hf-cache/hub/gemma-4-26b-a4b-it"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
# 4096 input + 128 output = 4224 live positions, and max_ctx must be a multiple of 2048
# (the full-attn KV head window max_ctx*512*2 must be a multiple of the VMM 2 MiB
# granularity — 8704 fails this, see the realtime recipe). 6144 = 3 granules.
max_ctx = 6144
precision = "bf16"

[emit]
args = ["--segmented"]
[emit.env]
# The HD256-GQA2 / HD512 prefill role objects bind the TMA map; opt-in (its P certificate was rejected).
PLOW_TMA_GEMM = "1"
# Decode attention QK on the tensor cores; opt-in (its P certificate was rejected:
# 26B 128/C1 TPOT 5.400 -> 5.418 ms, worse than its 0.002 floor, while longer contexts win).
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
# Rungs of >= 8 rows sort their B*k slots by expert and run the routed experts through the
# grouped tensor-core GEMMs (step_bench ms/step at B=8/16: 16.3 -> 14.3, 27.0 -> 18.0).
PLOW_GEMMA_MOE_DEC_GROUP = "8"
# The lever. 1024 keeps the sliding ring at 2048 rows so 32 slots fit with room to
# spare; it costs prefill chunking at the long rungs, which is why the realtime cell
# keeps 4096 and this one does not serve the 8K rung.
PLOW_MAX_CHUNK = "1024"
PLOW_FUSE_ARGMAX = "1"
# The exact scorer replays the legacy scalar fmaf order on ONE lane per expert: measured
# 0.0460 ms/layer at B=1 vs 0.0085 for ScoreFast (moe_decode_gemma26b_bench.cu) — 1.1 ms of
# an 8.15 ms C1 decode step. ScoreFast is f32 end to end with a tree reduction, which is
# already tighter than the reference: vLLM's Gemma4Router feeds bf16 h2 into its GateLinear.
# The prefill router (moe90_router_gemma_pf) makes the same bf16-h2 / f32-logit choice.
PLOW_GEMMA_MOE_ROUTER_EXACT = "0"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
# EMPTY, like the 12B C32 recipe. BOTH attention roles need the M4096/M8192 prefill
# rungs and chunk 1024 emits neither, so shipping their objects only makes the role
# emit refuse:
#   panicked at devgen/src/lib.rs:9594: prefill attention object: packet has no
#   M4096/M8192 paired HD256/GQA2 attention rungs
# The hd512 requirement was obvious and handled; the HD256/GQA2 role has the SAME one.
# Full-attention and sliding layers both fall back to the in-megakernel bodies here.
role_files = []
[objects.env]

[emit_roles.env]
# BOTH off: every attention role needs the M4096/M8192 prefill rungs and chunk 1024
# emits neither, so both fall back to the in-megakernel bodies. Same trade the 12B C32
# recipe makes (its emit_roles has both at 0 and role_files empty). This is the cost of
# buying concurrency: the serving cell gives up the attention roles that the realtime
# cell keeps.
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "0"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"

[serve.env]
PLOW_PREFIX_CACHE = "0"
# hd256 flash on the _pffa object too: this cell was measured with the unset knob, which on an
# hd256-capable object used to mean `all`; unset now follows the packet (hd512 only).
PLOW_PF_SEG_FA512 = "all"
PLOW_PF_INTERLEAVE = "0"
PLOW_LIBCUDA = "/usr/lib/x86_64-linux-gnu/libcuda.so.595.91.07"
LD_LIBRARY_PATH = "/usr/local/cuda/lib64"

[bench]
backend = "openai"
in_lens = "1024 4096"
concs = "16 32"
nprompt = 64
outlen = 128
warmups = 2
seed = 42
tokenizer = "/opt/dlami/nvme/hf-cache/hub/gemma-4-26b-a4b-it"
model_id = "gemma-4-26b-a4b-it"
gate_prompt = "<bos><start_of_turn>user\nWhat is the capital of France? Answer in one short sentence.<end_of_turn>\n<start_of_turn>model\n"

[bench.profiles.high_concurrency]
in_lens = "1024 4096"
concs = "16 32"
nprompt = 64
serve_env = { PLOW_MULTISTEP = "8", PLOW_DECODE_MAX_RUNG = "32", PLOW_PF_INTERLEAVE = "0", PLOW_TOKEN_BATCH = "1", PLOW_QUEUE_TTL_MS = "0" }

[reference]
csv = "perf-data/campaign/gemma4-26b-a4b.h100.reference-vllm028-bf16-high-concurrency.csv"
