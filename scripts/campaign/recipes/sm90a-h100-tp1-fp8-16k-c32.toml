# Gemma 4 12B FP8, H100 SXM 80 GB: 16K context, 32 slots, BF16 KV.
# Candidate only; matched performance and quality qualification are pending.
# Set GEMMA12B_CHECKPOINT to the byte-preserving re-keyed hub checkpoint.
# Build with campaign.py inside Nix; GPU tests use gpuq/gpulease.
# Decode ladder 1/2/4/8/16/32 uses the ordinary object (TC64 is not enabled).
# Prefill Lt covers measured regular and padded rungs, including 1088/1152/2112/4160/4224.
# Native: down at 1088 or >=2048; local K/V and global O at 4160; unmeasured rungs.
# Rung 2112 fits 2048 prefill rows plus 32 riders; native down/local O/global O.
# Attention and fused GLU keep the role objects below. Request chunks are capped at 2048.
# Capture the build record, recipe snapshot, Nix lock, compiler log and object hashes for dist.

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-12b"
label = "sm90a-h100-tp1-fp8-16k-c32"
status = "emits"
plow_git = "2a7da8fe9d190346b616d82570a425c22c15c372"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 16384
toolchain = "cuda-12.9-nix"

[checkpoint]
source = "gemma-4-12b-it-fp8"
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-12b.h100.fp8-16k-c32"
model = "gemma-4-12b-it-fp8 (compressed-tensors, re-keyed)"
revision = "local"
hf_dir = "{env:GEMMA12B_CHECKPOINT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "w8a8"

[emit]
args = ["--segmented"]
[emit.env]
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_EMIT_PACKED_PREFILL = "1"     # default-on only for BF16 Hopper; the roles need the metadata
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"               # [FP8-TAX] GEMMA4_SEG_FA512_DEFAULT is bf16-gated
PLOW_SEG_FA256_GQA2 = "1"          # [FP8-TAX] GEMMA4_SEG_FA256_GQA2_DEFAULT is bf16-gated
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "2048"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_NS_FULL_ABS = "66"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = [
  "interp_sm90a_pfattn_hd512_px4_bq64.cubin",
  "interp_sm90a_pfattn_hd256_gqa2_bkv32.cubin",
  "interp_sm90a_pfattn_hd256_bkv32.cubin",
  "interp_sm90a_pfgemm_glu_w8a8_gemma4.cubin",
]
[objects.env]
PLOW_BUILD_W8A8 = "1"
PLOW_BUILD_FA_GQA2_PAIR = "1"
PLOW_BUILD_PFATTN_HD256_BKV32 = "1"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "1"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "1"

[emit_roles.env]
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "1"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "1"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "1"

[serve.env]
PLOW_PREFIX_CACHE = "0"
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
PLOW_PF_INTERLEAVE = "0"
PLOW_VMM_LIVE_RINGS = "0"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "32"
PLOW_TOKEN_BATCH = "1"
PLOW_QUEUE_TTL_MS = "0"
PLOW_RUNG_FAST_PROBE = "1"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:GEMMA12B_CHECKPOINT}"
model_id = "checkpoint"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[bench.profiles.realtime]
in_lens = "128 1024 4096 7000 15000"
concs = "1 4"
nprompt = 32
serve_env = { PLOW_DECODE_MAX_RUNG = "4" }

[bench.profiles.high_concurrency]
in_lens = "128 1024 4096 7000 15000"
concs = "16 32 64 128"
nprompt = 384
serve_env = { PLOW_DECODE_MAX_RUNG = "32" }

[reference]
csv = "perf-data/campaign/gemma4-12b.h100.reference-vllm028-fp8.csv"
