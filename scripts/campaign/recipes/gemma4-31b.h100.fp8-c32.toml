# Trial: Gemma-4-31B-it FP8 (RedHatAI compressed-tensors, re-keyed) on one H100 SXM5. W8A8 weights,
# FP8 per-token-head KV, 32 decode slots (an FP8 2048-row sliding ring is 800 MiB per slot: 50 layers
# x 16 KV heads x 256 x K+V), prefix cache on. The 12B dense FP8 route family.
schema = "plow.recipe.v1"
namespace = "campaign"
name = "gemma-4-31b"
label = "sm90a-h100-tp1-fp8-c32"
status = "experimental"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 131072
toolchain = "cuda-12.9"

[checkpoint]
source = "gemma-4-31b-it-fp8"
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-31b.h100.fp8-c32"
model = "gemma-4-31b-it-fp8 (compressed-tensors, re-keyed)"
revision = "local"
hf_dir = "{env:PLOW_FP8_CKPT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 131072
precision = "w8a8"

[emit]
args = ["--segmented", "--served-name", "gemma-4-31b-it-fp8"]
[emit.env]
PLOW_GLU_QUANT_FUSE = "1"
NVCC_APPEND_FLAGS = "-DPLOW_NV_GLU_QUANT_CACHE=1 -DPLOW_NV_GLU_QUANT_WPR=1 -DPLOW_NV_LIGHT_FP8_ATTN=1 -DPLOW_FP8_LD16=1 -DPLOW_FP8_FAST=1"
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_FP8_KV = "1"
PLOW_EMIT_PACKED_PREFILL = "1"
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"
PLOW_SEG_FA256_GQA2 = "1"
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32"
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "16"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = ["gen_sm90a_attn_pf_hd256_sliding_fp8kv.cubin", "gen_sm90a_attn_pf_hd512_fp8kv.cubin"]
[objects.env]
PLOW_BUILD_FATLITE = "1"
NVCC_APPEND_FLAGS = "-DPLOW_NV_GLU_QUANT_CACHE=1 -DPLOW_NV_GLU_QUANT_WPR=1"
PLOW_BUILD_W8A8 = "1"
PLOW_BUILD_FP8KV_GEMM = "1"
PLOW_BUILD_FA_GQA2_PAIR = "0"
PLOW_BUILD_PFATTN_HD256_BKV32 = "0"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "0"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "0"
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"

[emit_roles.env]
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "0"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding_fp8kv,attn_pf_hd512_fp8kv"

[serve.env]
PLOW_PREFIX_CACHE = "1"
PLOW_VMM_PREFIX = "1"
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
PLOW_VMM_LIVE_RINGS = "0"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "32"
PLOW_TOKEN_BATCH = "1"
PLOW_LT_FP8_FAST_ACCUM_MAX_K = "8192"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:PLOW_FP8_CKPT}"
model_id = "gemma-4-31b-it-fp8"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:G31_FP8_FP32_REF}"
vllm_capture = "{env:G31_FP8_FP32_VLLM}"
concurrency = 16
timeout_s = 2400
