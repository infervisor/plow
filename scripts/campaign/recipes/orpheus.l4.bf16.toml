# Trial: Orpheus 3B TTS (canopylabs/orpheus-3b-0.1-ft) on L4 (sm_89, 58 SMs), BF16. The Veena H100
# recipe's codec-LM contract with the `orpheus` profile, minus the Hopper-only decode knobs (decode
# cuBLASLt, FA fold, dense tune) and the wgmma `_gw` rungs past 32. Prefill projections go through
# cuBLASLt (Llama-TTS shapes). The SNAC decoder runs as codec.pkt on the sm_89 speech object.
#
#   PYREF=<python with torch + snac> python3 scripts/campaign/campaign.py build \
#     scripts/campaign/recipes/orpheus.l4.bf16.toml --hf-dir <orpheus snapshot> --out <fresh dir>

schema = "plow.recipe.v1"
namespace = "infervisor"
name = "orpheus"
label = "sm89-l4-tp1"
network = "llama"

[target]
vendor = "nvidia"
isa = "sm_89"
sku = "L4"
units = 58
num_gpus = 1
parallel = "tp"

[checkpoint]
source = "hf:canopylabs/orpheus-3b-0.1-ft"
codec = "hf:hubertsiuzdak/snac_24khz"
codec_revision = "d73ad176a12188fcf4f360ba3bf2c2fbbe8f58ec"

[cell]
name = "orpheus-l4"
hf_dir = "{hf:canopylabs/orpheus-3b-0.1-ft}"
gpu = "l4"
arch = "sm_89"
n_cu = 58
n_gpu = 1
max_ctx = 2048

# SNAC decoder export (folded weight norm, torch layouts) read by the codec lowering.
[[prep]]
name = "snac-export"
script = "scripts/tts/snac_export.py"
args = ["{out}/prep/snac"]

[emit]
emit = "devblob+cubin"
args = ["--served-name", "orpheus"]
[emit.env]
PLOW_TTS_PROFILE = "orpheus"
PLOW_TTS_CODEC_DIR = "{out}/prep/snac"
PLOW_VERIFY_BIN = "{repo}/lean-plow/.lake/build/bin/plow_verify"
PLOW_MAX_CHUNK = "512"
PLOW_PF_LADDER_APPEND = "64,256"
# 16 streams: 3.5 GiB of KV (32 is 7 GiB), leaving room for the codec and an ASR model on 24 GB.
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_NO_GLU_FUSE = "1"

[bench]
kind = "speech"
client = "scripts/tts/tts_bench.py"

[gates]
python = "{env:PYREF}"
[gates.tts_cer]
# English prompts on an Orpheus voice (the default set's Veena voices are not in prompt.voices: 400).
arms = ["--conc 1 --stream --wav --n 16 --prompt-set chatterbox --voice tara", "--conc 16 --stream --wav --n 32 --prompt-set chatterbox --voice tara"]
cer_median_max = 0.05
