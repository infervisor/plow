# Experimental 16K/64-slot BF16-KV candidate. Inherits the 8K/64 prefill routes and TC64 decode.
# Light-op FATLITE object + generated hd256 sliding prefill + PLOW_QNORM_FUSE (2026-10-04,
# plowrt 9e532bd7, packet ec5aa004): 1x4096 prefill 150.6 -> 128.1 ms, 1x15000 641 -> 558 ms,
# 1x1024 40.3 -> 33.3, 16x512 25.2 -> 23.7, 32x128 16.4 -> 16.2; first-token digests unchanged.
# FP32 gate PASS (kl_mean 0.070 vs vLLM 0.128). Served REPS=2 out tok/s vs the same binary without
# them: 4K/128 c32 586 -> 640, c128 630 -> 700; 15K/128 c32 181 -> 203, c128 187 -> 209.
# Strict vs vLLM 0.28 BF16 KV (MATCHED, EQUIVALENT): total tok/s 0.82x / 0.79x / 0.86x / 0.86x.
# Request chunk 4096 with staged sliding layers (PLOW_STAGE_ROWS auto = 1024) keeps the 2048-row
# sliding ring and 56 GiB KV. vs request chunk 1024 (2026-10-03, REPS=2, live rings 0): agentic16k
# c32/c64/c128 tok/s 374/353/353 vs 380/353/342, TTFT p99 -25/-2/-4%, TPOT p99 +9/+5/+6%;
# 15K/128 c32 TTFT p50 2571 vs 3266 ms; 4K/128 c32 TTFT p50 626 vs 1072 ms. Label kept for history.
# Compare against the 16K/32 request-chunk2048 recipe with matched traffic.
# 2026-10-05 GLU role off + 64-row decode cuBLASLt (+ plowrt 1088/4160 Lt routes, ride trim), served
# REPS=2 total tok/s vs the final3 arm: 4K/128 c32/c128 +4.8/+6.5%, 15K/128 +4.0/+4.0%, agentic16k
# c32/c64/c128 +3.5/+3.3/+10.8%. With plowrt 1a4e4f76 (GLU-quant and NormResidual+RmsNorm light
# routes), strict vs vLLM 0.28 BF16 KV (MATCHED, EQUIVALENT, FP32 gate kl_mean 0.112 vs 0.128):
# 4K/128 c32/c128 0.91x/0.88x, 15K/128 0.94x/0.95x, agentic16k c32/c64/c128 0.71x/2.13x/1.60x.
schema = "plow.recipe.v1"
namespace = "infervisor"
name = "gemma-4-12b"
label = "sm90a-h100-tp1-fp8-16k-c64-rq1k"
status = "emits"
plow_git = "b23df445342767a8e9255a72d88bb087b67d8740"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 16384
toolchain = "cuda-12.9-nix"

[checkpoint]
source = "gemma-4-12b-it-fp8"
layout = "plow-fp8-hub-rekey"

[cell]
name = "gemma4-12b.h100.fp8-16k-c64-rq1k"
model = "gemma-4-12b-it-fp8 (compressed-tensors, re-keyed)"
revision = "local"
hf_dir = "{env:GEMMA12B_CHECKPOINT}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "w8a8"

[emit]
args = ["--segmented"]
[emit.env]
PLOW_FP8 = "1"
PLOW_W8A8 = "1"
PLOW_EMIT_PACKED_PREFILL = "1"     # default-on only for BF16 Hopper; the roles need the metadata
PLOW_SEG_PURE_GEMM = "fp8"
PLOW_SEG_FA512 = "1"               # [FP8-TAX] GEMMA4_SEG_FA512_DEFAULT is bf16-gated
PLOW_SEG_FA256_GQA2 = "1"          # [FP8-TAX] GEMMA4_SEG_FA256_GQA2_DEFAULT is bf16-gated
PLOW_TMA_GEMM = "1"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_SLIDING_NS_CAP = "1"
PLOW_SLIDING_NS_GRID = "1"
PLOW_ATTENTION_DECODE_BALANCE_GF = "4"
PLOW_NS_FULL_ABS = "66"
PLOW_FA_MMAQK = "3"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8,16,32,64"
PLOW_FP8_DECODE_TC64 = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"
# Quant folded into the pre-QKV / pre-FFN RmsNorm (T11; also folds Glu into the down quant on
# rungs without the GLU role). 4096 rung 128.7 -> 128.0 ms on top of FATLITE + generated hd256.
PLOW_QNORM_FUSE = "1"
# cuBLASLt projections + lm_head on the 64-row decode rung only (narrower rungs keep the native
# TC64 GEMV, which wins there): step_bench B64 ctx 1024/4096/15000 22.7/24.4/30.7 -> 21.0/22.8/29.1 ms;
# B16/B32 unchanged and bit-identical (2026-10-05).
PLOW_EMIT_DECODE_CUBLASLT = "1"
PLOW_EMIT_DECODE_CUBLASLT_MIN_ROWS = "64"
PLOW_EMIT_DECODE_CUBLASLT_HEAD = "1"
NVCC_APPEND_FLAGS = "-DPLOW_NV_GLU_QUANT_CACHE=1 -DPLOW_NV_GLU_QUANT_WPR=1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = [
  "interp_sm90a_pfattn_hd512_px4_bq64.cubin",
  "interp_sm90a_pfattn_hd256_gqa2_bkv32.cubin",
  "interp_sm90a_pfattn_hd256_bkv32.cubin",
  "gen_sm90a_attn_pf_hd256_sliding.cubin",
]
[objects.env]
# Without the GLU role the down quant computes the GeGLU itself: cached + whole-CTA rows.
NVCC_APPEND_FLAGS = "-DPLOW_NV_GLU_QUANT_CACHE=1 -DPLOW_NV_GLU_QUANT_WPR=1"
PLOW_BUILD_W8A8 = "1"
# Light-op object (norm/quant/rope+KV write) without the flash arms: 56 B stack vs 2144 B stack
# and 7.5 KB spills in the generic body (W8A8 packets default FATLITE off). Bit-identical;
# light ops 44.6 -> 30.8 ms per 4096-row chunk.
PLOW_BUILD_FATLITE = "1"
# Generated sliding hd256 prefill attention (role 19) on rungs >= 1024: 160 staged sites per
# 4096 chunk 17.4 -> 8.2 ms (role 14 0.109 vs 0.051 ms per 1024-row stage).
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding"
PLOW_BUILD_FA_GQA2_PAIR = "1"
PLOW_BUILD_PFATTN_HD256_BKV32 = "1"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "1"
PLOW_BUILD_PFATTN_HD512_PX4_BQ64 = "1"
# CUTLASS swap-AB FP8 decode projections for the routed 64-row rung (PLOW_CUTLASS_FP8_DECODE).
PLOW_BUILD_CUTLASS_FP8_DECODE = "1"

[emit_roles.env]
# GLU role off (Lt gate/up + fused GeGLU-quant): step_bench 1x4096 128.5 -> 126.8 ms, 1x15000
# 575 -> 568, 1x1024 34.2 -> 32.5; first-token digests unchanged (2026-10-05).
PLOW_GEMMA4_SM90_W8A8_GEMM_GLU_ROLE = "0"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "1"
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "1"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding"

[serve.env]
# Prefix cache at its default (on): agentic16k c32 with it on 700-732 tok/s at 75% cached
# (2026-10-04 prefix-hit v5 and bf16-headroom runs) vs 295 tok/s with PLOW_PREFIX_CACHE=0
# (final compare v2, same packet line); FP32 gate PASS with reuse on (kl_mean 0.118).
PLOW_PF_SEG_PURE = "fp8"
PLOW_PF_SEG_FA512 = "1"
PLOW_PF_INTERLEAVE = "0"
PLOW_VMM_LIVE_RINGS = "0"           # 1 costs 12-50% single-turn tok/s at 15K c32 with BF16 KV
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "64"
PLOW_TOKEN_BATCH = "1"
# Prefill FP8 Lt GEMMs with K <= 8192 (all but down) use fast accumulation: step_bench 1x4096
# 118.5 -> 109.4 ms, 1x15000 538 -> 492; served 4K c32 out tok/s +4.2% (2026-10-05).
PLOW_LT_FP8_FAST_ACCUM_MAX_K = "8192"
# B64 decode projections on the packet's CUTLASS objects (cubin:host sha256, CUDA 12.9 + g++-14):
# step_bench B64 ctx 4096 22.84 -> 20.85 ms, ctx 15000 29.12 -> 27.13; 4K c128 out tok/s +1.7%.
PLOW_CUTLASS_FP8_DECODE = "19fe64363466b253735f19ff120afdc63de6d9ae3efb3dc5115447917fb2d850:065e9acadc6cd2220a61978d729ab05c2aadf6107d514208175bc7625348ff07"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:GEMMA12B_CHECKPOINT}"
model_id = "checkpoint"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[bench.profiles.realtime]
in_lens = "128 1024 4096 7000 15000"
concs = "1 4"
nprompt = 32
serve_env = { PLOW_DECODE_MAX_RUNG = "4" }

[bench.profiles.high_concurrency]
in_lens = "128 1024 4096 7000 15000"
concs = "16 32 64 128"
nprompt = 384
serve_env = { PLOW_DECODE_MAX_RUNG = "64" }

[reference]
csv = "perf-data/campaign/gemma4-12b.h100.reference-vllm028-fp8.csv"
