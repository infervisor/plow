# Trial: Gemma-4-31B-it BF16 weights, BF16 KV on one H100 SXM5, 8 decode slots, 16384 context, prefix
# cache on. BF16 weights are 57 GiB; a BF16 2048-row sliding ring is 1.6 GiB per slot (50 layers x 16
# KV heads x 256 x K+V x 2 B), so 8 slots = 12.5 GiB of rings beside the VMM full-attention KV.
schema = "plow.recipe.v1"
namespace = "campaign"
name = "gemma-4-31b"
label = "sm90a-h100-tp1-bf16-c8"
status = "experimental"
network = "gemma4"

[target]
vendor = "nvidia"
isa = "sm_90a"
sku = "H100 SXM5"
units = 132
num_gpus = 1
parallel = "tp"
max_ctx = 16384
toolchain = "cuda-12.9"

[checkpoint]
source = "google/gemma-4-31B-it"
layout = "hf"

[cell]
name = "gemma4-31b.h100.bf16-c8"
model = "google/gemma-4-31b-it"
revision = "842da3794eaa0b77d5f08bae87a17459d91ff475"
hf_dir = "{env:HF31}"
gpu = "H100 SXM5"
arch = "sm_90a"
n_cu = 132
max_ctx = 16384
precision = "bf16"

[emit]
args = ["--segmented", "--served-name", "gemma-4-31b-it"]
[emit.env]
PLOW_TMA_GEMM = "1"
PLOW_FA_MMAQK = "3"
PLOW_MAX_CHUNK = "4096"
PLOW_MAX_REQUEST_CHUNK = "4096"
PLOW_DECODE_BATCH_LADDER = "1,2,4,8"
PLOW_PF_LADDER_APPEND = "256,1088,1152,2112,4160,4224"
PLOW_FUSE_ARGMAX = "1"
PLOW_EMIT_PREFILL_CUBLASLT = "1"

[objects]
script = "scripts/build_sm90a_gemma4_segments.sh"
role_files = [
  "interp_sm90a_pfattn_hd512.cubin",
  "interp_sm90a_pfattn_hd256_gqa2_bkv32.cubin",
  "interp_sm90a_pfattn_hd256_bkv32.cubin",
  "gen_sm90a_attn_pf_hd256_sliding.cubin",
]
[objects.env]
PLOW_BUILD_GEN_KERNELS = "attn_pf_hd256_sliding"
PLOW_BUILD_FA_GQA2_PAIR = "1"
PLOW_BUILD_PFATTN_HD256_BKV32 = "1"
PLOW_BUILD_PFATTN_HD256_GQA2_BKV32 = "1"

[emit_roles.env]
PLOW_GEMMA4_SM90_HD256_GQA2_ROLE = "1"
PLOW_GEMMA4_SM90_HD512_PX4_BQ64_ROLE = "0"
PLOW_EMIT_GEN_KERNELS = "attn_pf_hd256_sliding"

[serve.env]
PLOW_PREFIX_CACHE = "1"
PLOW_VMM_LIVE_RINGS = "0"
PLOW_MULTISTEP = "0"
PLOW_DECODE_MAX_RUNG = "8"
PLOW_TOKEN_BATCH = "1"
PLOW_PF_ATTN_GEMM_MIN_ROWS = "128"
PLOW_PF_ATTN_GEMM_S32 = "1"

[bench]
backend = "openai"
in_lens = "128 1024 4096"
concs = "1"
nprompt = 32
outlen = 128
warmups = 2
seed = 42
tokenizer = "{env:HF31}"
model_id = "gemma-4-31b-it"
gate_prompt = "<bos><|turn>user\nWhat is the capital of France? Answer in one short sentence.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>"

[gates]
python = "{env:PYREF}"
[gates.llm_fp32_ref]
reference = "{env:G31_BF16_FP32_REF}"
vllm_capture = "{env:G31_BF16_FP32_VLLM}"
concurrency = 8
timeout_s = 2400
