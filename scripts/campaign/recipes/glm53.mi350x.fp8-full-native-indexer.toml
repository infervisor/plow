[cell]
name = "glm53.mi350x.fp8-full-native-indexer"
model = "zai-org/GLM-5.3"
revision = "aca966e4e02791568aa6a4ced368624b3d897f42"
hf_dir = "/opt/models/GLM-5.3-full-aca966e4"
checkpoint_dir = "/opt/models/GLM-5.3-full-aca966e4-plow-mla-fp8-tp8"
gpu = "MI350X"
arch = "gfx950"
n_cu = 256
n_gpu = 8
precision = "fp8"
max_ctx = 131072

[emit]
emit = "devblob"
args = ["--num-gpus", "8"]

[emit.env]
PLOW_VERIFY_BIN = "/home/lava/plow/lean-plow/.lake/build/bin/plow_verify"
GLM_FULL = "1"
GLM_SHARD_HEAD = "1"
PLOW_FP8 = "1"
PLOW_GLM_DSA = "1"
PLOW_GLM_DSA_PF = "1"
PLOW_DECODE_BATCH_LADDER = "1,8"
PLOW_MLA_PREFILL = "full:128,8192"
GLM_MOE_CORESIDENT = "1"
GLM_LINEAR_FP8 = "1"
PLOW_GLM_QKVA_W8A8 = "1"
PLOW_GLM_MLA_W8A8 = "1"
PLOW_GLM_INDEXER_WQ_W8A8 = "1"
PLOW_GLM_INDEXER_FP8 = "1"
PLOW_GLM_MLA_BF16_PS = "1"
PLOW_GLM_ROPE_BF16 = "1"
PLOW_GLM_OPROJ_W8A8 = "1"
PLOW_GLM_SHARED_W8A8 = "1"
PLOW_GLM_ROUTED_W8A8 = "1"
PLOW_UNISEG = "0"

[objects]
script = "scripts/build_gfx950.sh"

[objects.env]
PLOW_GEMV_MM = "4"
PLOW_GEMV_WALK = "1"
PLOW_MLA_PREFILL = "1"
PLOW_MOE_PREFILL = "1"

[serve.env]
PLOW_TP_NO_AUDIT = "0"
PLOW_TP_AGREE_EVERY = "1"
PLOW_PREFIX_CACHE = "0"

[bench]
model_id = "glm-5.3"
tokenizer = "/opt/models/GLM-5.3-full-aca966e4"
in_lens = "8192"
concs = "8"
outlen = 128
nprompt = 128
seed = 8193
ready_s = 1800

[bench.profiles.qualification]

[reference.env]
VLLM_ROCM_USE_AITER = "1"

[roofline]
bandwidth_gbps = 6200.0
bf16_tflops = 2300.0
fp8_tflops = 4600.0
target_throughput_tps = 3000.0
